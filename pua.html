}

function renderQuestion(){
  var q=questions[currentQ];var total=questions.length;
  var progress=(currentQ/total)*100;
  document.getElementById('progressFill').style.width=progress+'%';
  document.getElementById('progressLabel').textContent='第 '+(currentQ+1)+' 题';
  document.getElementById('progressCount').textContent=(currentQ+1)+' / '+total;
  document.getElementById('qNum').textContent='问题 '+(currentQ+1);
  document.getElementById('qTitle').textContent=q.q;
  document.getElementById('qScenario').innerHTML=q.scenario||'';
  var optsHtml='';var labels=['A','B','C','D'];
  q.opts.forEach(function(o,i){
    optsHtml+='<div class="option" onclick="selectOption(\''+o.type+'\')"><div class="opt-label">'+labels[i]+'</div><div class="opt-text">'+o.t+'</div></div>';
  });
  document.getElementById('qOptions').innerHTML=optsHtml;
}

function selectOption(type){
  scores[type]++;
  currentQ++;
  if(currentQ>=questions.length){showResult();}
  else{window.scrollTo(0,0);renderQuestion();}
}

function showResult(){
  var maxType='A',maxScore=-1;
  for(var k in scores){if(scores[k]>maxScore){maxScore=scores[k];maxType=k;}}
  var r=results[maxType];
  
  document.getElementById('page-quiz').style.display='none';
  document.getElementById('page-result').style.display='flex';
  
  // 免疫力圆环
  var ring=document.getElementById('rRing');
  ring.style.color=r.color;
  ring.style.background=r.bg;
  document.getElementById('rImmunityNum').textContent=r.immunity;
  
  document.getElementById('rTitle').textContent=r.title;
  document.getElementById('rTitle').style.color=r.color;
  var badge=document.getElementById('rBadge');
  badge.textContent=r.badge;
  badge.style.background=r.color;
  badge.style.color='#fff';
  
  // 描述
  var descHtml=r.desc.split('\n').map(function(p){return p.trim()?'<p style="margin-bottom:10px">'+p+'</p>':''}).join('');
  if(r.quote)descHtml+='<blockquote style="border-left:3px solid '+r.color+';background:'+r.bg+';padding:12px 16px;margin:16px 0;border-radius:0 8px 8px 0;font-style:italic;color:'+r.color+'">「'+r.quote+'」</blockquote>';
  document.getElementById('rDesc').innerHTML=descHtml;
  
  // 4维度评分
  var dims=[{k:'awareness',n:'认知清醒度'},{k:'boundary',n:'边界感'},{k:'emotion',n:'情绪管理'},{k:'action',n:'行动力'}];
  var scoresHtml='<div style="font-size:14px;font-weight:700;color:'+r.color+';margin-bottom:14px;text-align:left">📊 你的PUA防御力分析</div>';
  dims.forEach(function(d){
    var v=r.scores[d.k];
    var label=v>=85?'极强':v>=70?'中高':v>=50?'中等':v>=35?'偏弱':'较弱';
    var barColor=v>=70?'#12b76a':v>=50?'#f79009':'#d92d20';
    scoresHtml+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="color:#333;font-weight:600">'+d.n+'</span><span style="color:'+barColor+';font-weight:700">'+label+' '+v+'</span></div><div style="height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden"><div style="height:100%;width:'+v+'%;background:'+barColor+';border-radius:3px"></div></div></div>';
  });
  document.getElementById('rScores').innerHTML=scoresHtml;
  
  // 建议
  var tipsHtml='<div style="font-size:14px;font-weight:700;color:'+r.color+';margin-bottom:12px">💡 给你的自保建议</div>';
  r.tips.forEach(function(t){tipsHtml+='<div style="font-size:13px;color:#555;margin-bottom:8px;padding-left:18px;position:relative"><span style="position:absolute;left:0;color:'+r.color+'">✓</span>'+t+'</div>'});
  document.getElementById('rTips').innerHTML=tipsHtml;
  
  // 特质
  var traitsHtml=r.traits.map(function(t){return '<span class="r-trait" style="background:'+r.bg+';color:'+r.color+'">'+t+'</span>'}).join('');
  document.getElementById('rTraits').innerHTML=traitsHtml;
}

function resetQuiz(){
  document.getElementById('page-result').style.display='none';
  document.getElementById('page-cover').style.display='flex';
}

// === 分享图 ===
function showShare(){document.getElementById('shareModal').classList.add('show');drawShareCard();}
function closeShare(){document.getElementById('shareModal').classList.remove('show');}

function drawShareCard(){
  var canvas=document.getElementById('shareCanvas');var ctx=canvas.getContext('2d');
  var W=360,H=540;
  var grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#fef3f2');grad.addColorStop(0.5,'#fee4e2');grad.addColorStop(1,'#fef0f0');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(253,162,155,0.12)';ctx.lineWidth=1;
  for(var x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  
  // 免疫力数字
  var num=document.getElementById('rImmunityNum').textContent;
  ctx.fillStyle=document.getElementById('rTitle').style.color||'#b42318';
  ctx.font='bold 56px sans-serif';ctx.textAlign='center';
  ctx.fillText(num,W/2,130);
  ctx.font='12px sans-serif';ctx.fillStyle='#999';
  ctx.fillText('PUA免疫力指数',W/2,155);
  
  // 标题
  ctx.fillStyle=document.getElementById('rTitle').style.color||'#b42318';
  ctx.font='bold 28px sans-serif';
  ctx.fillText(document.getElementById('rTitle').textContent,W/2,210);
  
  // badge
  ctx.font='bold 12px sans-serif';ctx.fillStyle='#666';
  ctx.fillText(document.getElementById('rBadge').textContent,W/2,240);
  
  // traits
  ctx.font='13px sans-serif';ctx.fillStyle='#333';
  var traits=document.getElementById('rTraits').innerText.replace(/\n/g,' · ');
  ctx.fillText(traits,W/2,290);
  
  // 二维码占位
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.roundRect?(ctx.roundRect(W/2-40,400,80,80,12)):(ctx.rect(W/2-40,400,80,80));
  ctx.fill();
  ctx.fillStyle='#b42318';ctx.font='11px sans-serif';
  ctx.fillText('扫码来测',W/2,430);
  ctx.font='bold 22px sans-serif';ctx.fillText('🐾',W/2,460);
  
  ctx.fillStyle='rgba(122,39,26,.3)';ctx.font='10px sans-serif';
  ctx.fillText('pua.xixizai.com',W/2,520);
  
  ctx.textAlign='left';
}

function downloadShare(){
  var link=document.createElement('a');
  link.download='我的职场PUA免疫力测试.png';
  link.href=document.getElementById('shareCanvas').toDataURL();
  link.click();
}
</script>
