.btn-start:active{transform:scale(0.96)}

/* 答题页 */
.quiz{display:none;padding:24px 20px 100px}
.q-num{font-size:14px;color:var(--primary);font-weight:700;margin-bottom:8px}

.result-footer{font-size:12px;color:var(--gray);text-align:center;padding:20px}

// ============ 维度中文名 ============
var dimNames={pace:'生活节奏',social:'社交浓度',ambition:'事业野心',culture:'文化偏好',climate:'气候偏好'};

var scores={pace:0,social:0,ambition:0,culture:0,climate:0};

function startQuiz(){
document.getElementById('cover').style.display='none';
document.getElementById('quiz').style.display='block';
document.getElementById('progText').style.display='block';
currentQ=0;
scores={pace:0,social:0,ambition:0,culture:0,climate:0};
answers=[];
renderQuestion();
}

function renderQuestion(){
var q=questions[currentQ];
var total=questions.length;
var pct=Math.round((currentQ/total)*100);
document.getElementById('progFill').style.width=pct+'%';
document.getElementById('progText').textContent=(currentQ+1)+'/'+total;
var h='';
h+='<div class="q-num">第 '+(currentQ+1)+' 题 <span>/ '+total+'</span></div>';
h+='<div class="q-scene">'+q.scene+'</div>';
h+='<div class="q-text">'+q.q+'</div>';
h+='<div class="options">';
q.opts.forEach(function(o,i){
h+='<div class="opt" onclick="selectOpt('+i+')" id="opt'+i+'">'+o.text+'</div>';
});
h+='</div>';
document.getElementById('quiz').innerHTML=h;
}

function selectOpt(i){
// 移除之前的选中
for(var j=0;j<4;j++){var el=document.getElementById('opt'+j);if(el)el.classList.remove('selected')}
document.getElementById('opt'+i).classList.add('selected');

// 记录答案
var q=questions[currentQ];
var dim=q.opts[i].dim;
for(var k in dim){scores[k]=(scores[k]||0)+dim[k]}
answers[currentQ]=i;

// 延迟跳到下一题
setTimeout(function(){
currentQ++;
if(currentQ<questions.length){renderQuestion()}
else{showResult()}
},350);
}

function getCityType(){
// 根据维度得分判断城市类型
var a=scores.ambition,p=scores.pace,s=scores.social,c=scores.culture,cl=scores.climate;

// 高野心+快节奏 → 搞钱型或战场型
if(a>=15&&p>=10){
// 如果社交也高，更偏搞钱型；如果社交低更偏战场型（独立作战）
if(s>=5)return 'maker';
return 'challenge';
}
// 高社交+中文化 → 烟火型
if(s>=10&&c>=3)return 'fire';
// 低社交+高文化 → 文艺型
if(s<=2&&c>=8)return 'art';
// 高文化+中野心 → 底蕴型
if(c>=10&&a>=3)return 'classic';
// 高气候 → 自由型
if(cl>=10)return 'free';
// 低野心+低节奏+中社交 → 归属型
if(a<=5&&p<=3)return 'roots';
// 默认：探索型
return 'explorer';
}

function drawRadar(pct){
var canvas=document.getElementById('radarCanvas');
if(!canvas)return;
var ctx=canvas.getContext('2d');
var cx=320,cy=320,r=200;
var n=5;
var labels=dimKeys.map(function(k){return dimNames[k]});
var values=dimKeys.map(function(k){return pct[k]/100});

ctx.clearRect(0,0,640,640);

// 背景多边形
for(var layer=1;layer<=5;layer++){
ctx.beginPath();
var rr=r*layer/5;
for(var i=0;i<n;i++){
var angle=-Math.PI/2+Math.PI*2*i/n;
var x=cx+Math.cos(angle)*rr;
var y=cy+Math.sin(angle)*rr;
if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
}
ctx.closePath();
ctx.strokeStyle='rgba(232,93,47,0.12)';
ctx.lineWidth=1;
ctx.stroke();
}

// 轴线
for(var i=0;i<n;i++){
var angle=-Math.PI/2+Math.PI*2*i/n;
ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(cx+Math.cos(angle)*r,cy+Math.sin(angle)*r);
ctx.strokeStyle='rgba(232,93,47,0.08)';
ctx.lineWidth=1;
ctx.stroke();
}

// 数据多边形
ctx.beginPath();
for(var i=0;i<n;i++){
var angle=-Math.PI/2+Math.PI*2*i/n;
var rr=r*values[i];
var x=cx+Math.cos(angle)*rr;
var y=cy+Math.sin(angle)*rr;
if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
}
ctx.closePath();
ctx.fillStyle='rgba(232,93,47,0.2)';
ctx.fill();
ctx.strokeStyle='#e85d2f';
ctx.lineWidth=2.5;
ctx.stroke();

// 数据点
for(var i=0;i<n;i++){
var angle=-Math.PI/2+Math.PI*2*i/n;
var rr=r*values[i];
var x=cx+Math.cos(angle)*rr;
var y=cy+Math.sin(angle)*rr;
ctx.beginPath();
ctx.arc(x,y,6,0,Math.PI*2);
ctx.fillStyle='#e85d2f';
ctx.fill();
ctx.strokeStyle='#fff';
ctx.lineWidth=2;
ctx.stroke();
}

// 标签
ctx.font='600 22px PingFang SC,sans-serif';
ctx.textAlign='center';
ctx.textBaseline='middle';
for(var i=0;i<n;i++){
var angle=-Math.PI/2+Math.PI*2*i/n;
var lr=r+36;
var x=cx+Math.cos(angle)*lr;
var y=cy+Math.sin(angle)*lr;
ctx.fillStyle='#3d2b1f';
ctx.fillText(labels[i],x,y);
// 分数
ctx.font='700 18px Arial,sans-serif';
ctx.fillStyle='#e85d2f';
ctx.fillText(Math.round(values[i]*100)+'',x,y+24);
ctx.font='600 22px PingFang SC,sans-serif';
}
}

</script>
