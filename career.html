<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>你天生该吃哪碗饭？10道题测出你的隐藏职业基因</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f7f0;color:#1b3a1b;overflow-x:hidden}
:root{--primary:#2e7d32;--primary-d:#1b5e20;--primary-l:#4caf50;--gold:#f5a623;--warm:#66bb6a;--dark:#1b3a1b;--gray:#7a9a7a;--bg:#f0f7f0;--card:#fffaf5;--radius:16px}
.wrap{max-width:480px;margin:0 auto;min-height:100vh}

/* 进度条 */
.progress-bar{position:fixed;top:0;left:0;right:0;height:4px;background:#e0e8e0;z-index:100}
.progress-fill{height:100%;background:linear-gradient(90deg,#2e7d32,#66bb6a,#f5a623);transition:width .4s ease;border-radius:0 4px 4px 0}
.progress-text{position:fixed;top:8px;right:16px;font-size:12px;color:var(--gray);z-index:100}

/* 封面页 */
.cover{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;background:linear-gradient(180deg,#e8f5e9 0%,#f0f7f0 50%,#fff8e1 100%)}
.cover-deco{font-size:72px;margin-bottom:8px}
.cover h1{font-size:34px;font-weight:900;color:var(--primary-d);line-height:1.3;margin-bottom:12px;letter-spacing:-1px}
.cover h1 span{color:var(--gold)}
.cover-sub{font-size:16px;color:var(--gray);line-height:1.6;margin-bottom:32px;max-width:320px}
.cover-features{display:flex;gap:12px;margin-bottom:40px;flex-wrap:wrap;justify-content:center}
.cover-tag{background:#fff;padding:8px 16px;border-radius:20px;font-size:13px;color:var(--dark);border:1px solid #c8e6c9;box-shadow:0 2px 8px rgba(46,125,50,0.06)}
.cover-tag b{color:var(--primary)}
.btn-start{background:linear-gradient(135deg,#2e7d32,#66bb6a);color:#fff;border:none;padding:16px 48px;border-radius:50px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(46,125,50,0.3);transition:transform .2s}
.btn-start:active{transform:scale(0.96)}
.cover-tip{margin-top:20px;font-size:13px;color:var(--gray)}

/* 答题页 */
.quiz{display:none;padding:24px 20px 100px}
.q-num{font-size:14px;color:var(--primary);font-weight:700;margin-bottom:8px}
.q-num span{color:var(--gray);font-weight:400}
.q-scene{font-size:14px;color:var(--gray);line-height:1.6;margin-bottom:20px;padding:12px 16px;background:#e8f5e9;border-radius:12px;border-left:3px solid var(--warm)}
.q-text{font-size:22px;font-weight:700;line-height:1.5;color:var(--dark);margin-bottom:28px}
.options{display:flex;flex-direction:column;gap:12px}
.opt{background:#fff;border:2px solid #e0e8e0;border-radius:14px;padding:18px 20px;cursor:pointer;transition:all .2s;font-size:15px;line-height:1.5;color:var(--dark);position:relative}
.opt:active{transform:scale(0.98);border-color:var(--primary);background:#f1f8f1}
.opt.selected{border-color:var(--primary);background:#f1f8f1}

/* 结果页 */
.result{display:none;padding:0 0 80px}
.result-hero{background:linear-gradient(180deg,#2e7d32 0%,#66bb6a 60%,#f0f7f0 100%);padding:48px 24px 32px;text-align:center;color:#fff;position:relative;overflow:hidden}
.result-hero::before{content:'';position:absolute;top:-50%;right:-30%;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,0.06)}
.result-hero::after{content:'';position:absolute;bottom:20%;left:-20%;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,0.04)}
.result-label{font-size:14px;opacity:0.85;margin-bottom:8px;position:relative;z-index:1}
.result-type{font-size:36px;font-weight:900;margin-bottom:8px;position:relative;z-index:1;text-shadow:0 2px 12px rgba(0,0,0,0.1)}
.result-badge{display:inline-block;background:rgba(255,255,255,0.25);backdrop-filter:blur(8px);font-size:13px;padding:4px 16px;border-radius:14px;margin-bottom:16px;position:relative;z-index:1;border:1px solid rgba(255,255,255,0.2)}
.result-emoji{font-size:56px;position:relative;z-index:1;margin-bottom:8px}

/* 雷达图 */
.radar-section{padding:24px 20px;text-align:center}
.radar-title{font-size:18px;font-weight:700;color:var(--dark);margin-bottom:16px}
.radar-canvas-wrap{display:flex;justify-content:center}
#radarCanvas{width:320px;height:320px}

/* 结果详情 */
.result-section{padding:20px;margin-top:8px}
.section-title{font-size:18px;font-weight:700;color:var(--dark);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:4px;height:20px;background:var(--primary);border-radius:2px}
.reason-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;border:1px solid #e8f0e8}
.reason-card h4{font-size:15px;color:var(--primary);margin-bottom:6px}
.reason-card p{font-size:14px;color:#3a5a3a;line-height:1.7}
.score-bar-wrap{margin-bottom:14px}
.score-bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.score-bar-label span:first-child{color:var(--dark);font-weight:600}
.score-bar-label span:last-child{color:var(--primary);font-weight:700}
.score-bar{height:8px;background:#e0e8e0;border-radius:4px;overflow:hidden}
.score-bar-fill{height:100%;background:linear-gradient(90deg,#66bb6a,#2e7d32);border-radius:4px;transition:width 1s ease}
.city-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.city-tag{background:#e8f5e9;color:var(--primary-d);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600}
.city-tag.warn{background:#fff3e0;color:#e65100}
blockquote{border-left:3px solid var(--primary);background:rgba(46,125,50,0.06);padding:12px 16px;margin:10px 0;border-radius:0 8px 8px 0;font-style:italic;color:var(--primary-d);font-size:14px}
.result-cta{margin:32px 20px;text-align:center}
.btn-share{background:linear-gradient(135deg,#2e7d32,#66bb6a);color:#fff;border:none;padding:14px 40px;border-radius:50px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(46,125,50,0.25);width:100%}
.btn-retest{background:none;border:1px solid #ddd;color:#999;padding:12px 40px;border-radius:50px;font-size:14px;cursor:pointer;margin-top:12px}
.result-footer{font-size:12px;color:var(--gray);text-align:center;padding:20px}
</style>
</head>
<body>
<div class="wrap">
<div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0"></div></div>
<div class="progress-text" id="progText" style="display:none"></div>

<!-- 封面 -->
<div class="cover" id="cover">
<div class="cover-deco">🚀</div>
<h1>你天生该吃<br><span>哪碗饭？</span></h1>
<div class="cover-sub">10道趣味场景题，从你的生活本能里提取4大职业基因维度。<br>别人还在犹豫，你已经开始干了。</div>
<div class="cover-features">
<div class="cover-tag">🎯 <b>4维</b>职业基因</div>
<div class="cover-tag">🏆 <b>4种</b>天赋型格</div>
<div class="cover-tag">📊 雷达图画像</div>
</div>
<button class="btn-start" onclick="startQuiz()">开始测试 →</button>
<div class="cover-tip">⏱️ 约2分钟出结果</div>
</div>

<!-- 答题 -->
<div class="quiz" id="quiz"></div>

<!-- 结果 -->
<div class="result" id="result"></div>
</div>

<script>
var questions=[
{scene:"又到周末了，你最自然的状态是——",q:"周末早上醒来，你的第一个念头是？",opts:[
{text:"今天能把那个想法落地了，干起来！",dim:{action:3,strategy:1}},
{text:"终于可以睡到自然醒，慢慢享受",dim:{create:2,social:-1}},
{text:"约谁出去玩呢？约一波朋友",dim:{social:3}},
{text:"列个今日计划表，安排得明明白白",dim:{strategy:3,action:1}}
]},
{scene:"朋友遇到困难找你诉苦——",q:"朋友诉苦时，你通常怎么反应？",opts:[
{text:"帮他分析问题到底出在哪",dim:{strategy:3}},
{text:"陪他一起骂，先爽了再说",dim:{social:3}},
{text:"默默听着，给个拥抱",dim:{create:2,social:1}},
{text:"你上次也这样，后来我这样解决了",dim:{action:3,strategy:1}}
]},
{scene:"团队讨论一个新项目——",q:"团队讨论时，你经常扮演的角色？",opts:[
{text:"提出新方向和新思路的人",dim:{action:3,create:1}},
{text:"活跃气氛，让讨论不那么沉闷",dim:{social:3}},
{text:"调和矛盾，让 everyone 都舒服",dim:{create:2,social:1}},
{text:"把控进度，确保讨论有结论",dim:{strategy:3}}
]},
{scene:"突然拿到一笔闲钱——",q:"给你一万块闲钱，第一反应？",opts:[
{text:"投到我的项目里滚雪球",dim:{action:3,strategy:1}},
{text:"请朋友吃顿大的，开心最重要",dim:{social:3}},
{text:"存起来，有安全感",dim:{strategy:1,create:1}},
{text:"买课程或工具提升自己",dim:{strategy:2,action:1}}
]},
{scene:"你最受不了的领导类型——",q:"哪种领导让你最窒息？",opts:[
{text:"朝令夕改，没有方向感",dim:{strategy:3}},
{text:"管太细，让人没有发挥空间",dim:{action:3}},
{text:"冷冰冰，完全不讲人情",dim:{social:2,create:1}},
{text:"开会念稿子两小时，废话连篇",dim:{social:2,action:1}}
]},
{scene:"学一个全新技能——",q:"你的学习方式是？",opts:[
{text:"先干起来，遇到问题再查",dim:{action:3}},
{text:"找个有趣的教程跟着玩",dim:{create:2,social:1}},
{text:"从基础开始，一步步稳扎稳打",dim:{create:2,strategy:1}},
{text:"系统看教程，做笔记列思维导图",dim:{strategy:3}}
]},
{scene:"深夜刷手机时间——",q:"你最容易陷进去看什么？",opts:[
{text:"行业大佬的创业故事、商业分析",dim:{action:2,strategy:1}},
{text:"搞笑段子、脱口秀、综艺",dim:{social:2}},
{text:"治愈系vlog、美食视频、文艺内容",dim:{create:3}},
{text:"干货帖、知识科普、深度长文",dim:{strategy:3}}
]},
{scene:"朋友吐槽你的缺点——",q:"朋友说你最大的缺点是？",opts:[
{text:"太折腾了，停不下来",dim:{action:3}},
{text:"太敏感，容易内耗想太多",dim:{create:2}},
{text:"太闹腾，静不下来",dim:{social:3}},
{text:"太较真，不够圆滑",dim:{strategy:2}}
]},
{scene:"如果拍一部关于你的电影——",q:"你的电影片名会是？",opts:[
{text:"《不服输的人》",dim:{action:3}},
{text:"《温柔的力量》",dim:{create:3}},
{text:"《人间值得好玩》",dim:{social:3}},
{text:"《掌控一切》",dim:{strategy:3}}
]},
{scene:"想象一下十年后——",q:"十年后的理想生活状态？",opts:[
{text:"有自己的事业，还在不断拓展",dim:{action:3,strategy:1}},
{text:"生活安稳，有时间做喜欢的事",dim:{create:2}},
{text:"世界各地都有朋友，走到哪都不无聊",dim:{social:3}},
{text:"在某个领域成为权威，受人尊敬",dim:{strategy:3}}
]}
];

var results={
A:{icon:"🚀",name:"天生的创业者",badge:"行动派",
desc:"你骨子里就不是一个安分的人。别人还在犹豫的时候，你已经开干了。你不怕失败，怕的是无聊。\n\n你的行动力远超分析欲，天生适合从0到1把事情做成。你最大的武器是「先干了再说」的魄力——这个世界永远奖励先动手的人。",
quote:"你不是太冲动，是别人太犹豫。",
scores:{action:95,create:70,social:60,strategy:75},
careers:["创业者/合伙人","自媒体/IP主理人","销售/BD负责人","项目经理"],
traps:["容易三分钟热度，启动太多项目收不住","不喜欢做细节工作，容易虎头蛇尾","对按部就班的人缺乏耐心"],
suggest:["把目标拆成可执行的30天计划","找一个互补的策略型搭档","定期复盘，别光顾着冲"],
match:"跟你合拍的人：能帮你做规划和收尾的策略型选手。你负责冲，ta负责稳。"},

B:{icon:"🌿",name:"天生的创作者",badge:"感受派",
desc:"你有一颗极度敏感的心，能感知到别人忽略的细节和情绪。这种敏感不是缺点，而是你的天赋——好的内容、好的设计、好的故事，都从这种感知力中来。\n\n你不是为竞争而生的，你是为创造而生的。安静地打磨自己的手艺，你的作品会替你说话。",
quote:"别人看到表面的热闹，你看到背后的故事。",
scores:{action:60,create:95,social:55,strategy:50},
careers:["内容创作者/作者","设计师/创意工作者","心理咨询师/疗愈师","独立手艺人"],
traps:["容易陷入完美主义，迟迟不敢发布","对负面评价过于敏感","容易在独处时陷入内耗"],
suggest:["设定「完成比完美重要」的发布标准","找到一两个深度的创作圈子","把敏感变成创作养分，而不是消耗源"],
match:"跟你合拍的人：能帮你把作品推广出去的社交型选手。你负责创作，ta负责让世界看到。"},

C:{icon:"🎉",name:"天生的连接者",badge:"社交派",
desc:"你是天生的「人际枢纽」。有你在的场合永远不会冷场，你能把陌生人变成朋友，把尴尬化为笑声。\n\n你的价值不在具体技能，而在于你能连接谁。市场、公关、社群运营——所有需要「搞定人」的事情，你都有天然优势。",
quote:"你的竞争力不是技能，是你认识谁。",
scores:{action:70,create:65,social:95,strategy:60},
careers:["市场/品牌营销","社群运营/KOL","活动策划/公关","商务拓展"],
traps:["容易把精力分散在太多社交上","不喜欢深度钻研，专业感不足","害怕独处，容易用社交逃避问题"],
suggest:["每月留出至少3天独处充电时间","发展一个深度专业作为社交的底座","学会说「不」，保护自己的时间"],
match:"跟你合拍的人：有深度专业技能的创作或策略型选手。你负责连接，ta负责交付。"},

D:{icon:"💎",name:"天生的操盘手",badge:"策略派",
desc:"你是那种让混乱变有序的人。给你一堆乱麻，你天然地就想找到线头在哪里。\n\n你不追求舞台上的聚光灯，你要的是「一切尽在掌握」的确定性。越是复杂的系统，越能体现你的价值。",
quote:"别人看到混乱，你看到结构。",
scores:{action:75,create:55,social:50,strategy:95},
careers:["运营/项目管理","投资分析师/顾问","产品经理/技术管理","数据分析师"],
traps:["过度分析，错过最佳行动时机","对不确定性强的事情焦虑","不太擅长处理情绪化的沟通"],
suggest:["给自己设一个「分析截止时间」，到点就行动","练习用感性语言沟通，别总讲逻辑","接受70%把握就可以动手"],
match:"跟你合拍的人：行动力强的创业型选手。你负责规划和把控，ta负责冲锋陷阵。"}
};

var dimNames={action:'行动力',create:'创造力',social:'社交力',strategy:'策略力'};
var dimKeys=['action','create','social','strategy'];

var currentQ=0;
var scores={action:0,create:0,social:0,strategy:0};
var answers=[];

function startQuiz(){
document.getElementById('cover').style.display='none';
document.getElementById('quiz').style.display='block';
document.getElementById('progText').style.display='block';
currentQ=0;
scores={action:0,create:0,social:0,strategy:0};
answers=[];
renderQuestion();
}

function renderQuestion(){
var q=questions[currentQ];
var total=questions.length;
var pct=Math.round((currentQ/total)*100);
document.getElementById('progFill').style.width=pct+'%';
document.getElementById('progText').textContent=(currentQ+1)+'/'+total;
var h='';
h+='<div class="q-num">第 '+(currentQ+1)+' 题 <span>/ '+total+'</span></div>';
h+='<div class="q-scene">'+q.scene+'</div>';
h+='<div class="q-text">'+q.q+'</div>';
h+='<div class="options">';
q.opts.forEach(function(o,i){
h+='<div class="opt" onclick="selectOpt('+i+')" id="opt'+i+'">'+o.text+'</div>';
});
h+='</div>';
document.getElementById('quiz').innerHTML=h;
}

function selectOpt(i){
for(var j=0;j<4;j++){var el=document.getElementById('opt'+j);if(el)el.classList.remove('selected')}
document.getElementById('opt'+i).classList.add('selected');
var q=questions[currentQ];
var dim=q.opts[i].dim;
for(var k in dim){scores[k]=(scores[k]||0)+dim[k]}
answers[currentQ]=i;
setTimeout(function(){
currentQ++;
if(currentQ<questions.length){renderQuestion()}
else{showResult()}
},350);
}

function showResult(){
document.getElementById('progFill').style.width='100%';
document.getElementById('progText').style.display='none';
document.getElementById('quiz').style.display='none';
document.getElementById('result').style.display='block';
window.scrollTo(0,0);

var type=getType();
var r=results[type];

var maxScore={action:30,create:30,social:30,strategy:30};
var pct={};
dimKeys.forEach(function(k){
var v=scores[k];if(v<0)v=0;
pct[k]=Math.min(100,Math.round((v/maxScore[k])*100));
});

var h='';
// Hero
h+='<div class="result-hero">';
h+='<div class="result-emoji">'+r.icon+'</div>';
h+='<div class="result-label">你的职业基因型格</div>';
h+='<div class="result-type">'+r.name+'</div>';
h+='<div class="result-badge">'+r.badge+'</div>';
h+='</div>';

// 雷达图
h+='<div class="radar-section">';
h+='<div class="radar-title">你的4维职业基因画像</div>';
h+='<div class="radar-canvas-wrap"><canvas id="radarCanvas" width="640" height="640"></canvas></div>';
h+='</div>';

// 描述
h+='<div class="result-section">';
h+='<div class="section-title">一句话概括你</div>';
h+='<div class="reason-card"><p style="font-size:15px;line-height:1.8;color:#3a5a3a">'+r.desc.replace(/\n/g,'<br>')+'</p>';
if(r.quote)h+='<blockquote>「'+r.quote+'」</blockquote>';
h+='</div></div>';

// 维度得分
h+='<div class="result-section">';
h+='<div class="section-title">维度得分详解</div>';
dimKeys.forEach(function(k){
var label=dimNames[k];
var score=pct[k];
var desc='';
if(k==='action')desc=score>=70?'你的行动力极强，说干就干':'你更偏稳重，喜欢想清楚再动';
if(k==='create')desc=score>=70?'你的创造力突出，对细节和美感极敏感':'你更偏务实，不太追求创意表达';
if(k==='social')desc=score>=70?'你是社交天花板，在人群中如鱼得水':'你偏内敛，在独处中更有能量';
if(k==='strategy')desc=score>=70?'你的策略感极强，天生的规划者和操盘手':'你更偏直觉型，不喜欢做系统性分析';
h+='<div class="score-bar-wrap">';
h+='<div class="score-bar-label"><span>'+label+'</span><span>'+score+'分</span></div>';
h+='<div class="score-bar"><div class="score-bar-fill" style="width:'+score+'%"></div></div>';
h+='<div style="font-size:12px;color:#999;margin-top:4px">'+desc+'</div>';
h+='</div>';
});
h+='</div>';

h+='<div class="result-section">';

function getType(){
var a=scores.action,c=scores.create,s=scores.social,st=scores.strategy;
if(a>=c&&a>=s&&a>=st)return 'A';
if(c>=a&&c>=s&&c>=st)return 'B';
if(s>=a&&s>=c&&s>=st)return 'C';
return 'D';
}

function drawRadar(pct){
var canvas=document.getElementById('radarCanvas');
if(!canvas)return;
var ctx=canvas.getContext('2d');
var cx=320,cy=320,r=200;
var n=4;
var labels=dimKeys.map(function(k){return dimNames[k]});
var values=dimKeys.map(function(k){return pct[k]/100});

ctx.clearRect(0,0,640,640);

// 背景多边形
for(var layer=1;layer<=5;layer++){
ctx.beginPath();
var rr=r*layer/5;
for(var i=0;i<n;i++){
var angle=-Math.PI/2+Math.PI*2*i/n;
var x=cx+Math.cos(angle)*rr;
var y=cy+Math.sin(angle)*rr;
if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
}
ctx.closePath();
ctx.strokeStyle='rgba(46,125,50,0.12)';
ctx.lineWidth=1;
ctx.stroke();
}

// 轴线
for(var i=0;i<n;i++){
var angle=-Math.PI/2+Math.PI*2*i/n;
ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(cx+Math.cos(angle)*r,cy+Math.sin(angle)*r);
ctx.strokeStyle='rgba(46,125,50,0.08)';
ctx.lineWidth=1;
ctx.stroke();
}

// 数据多边形
ctx.beginPath();
for(var i=0;i<n;i++){
var angle=-Math.PI/2+Math.PI*2*i/n;
var rr=r*values[i];
var x=cx+Math.cos(angle)*rr;
var y=cy+Math.sin(angle)*rr;
if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
}
ctx.closePath();
ctx.fillStyle='rgba(46,125,50,0.2)';
ctx.fill();
ctx.strokeStyle='#2e7d32';
ctx.lineWidth=2.5;
ctx.stroke();

// 数据点
for(var i=0;i<n;i++){
var angle=-Math.PI/2+Math.PI*2*i/n;
var rr=r*values[i];
var x=cx+Math.cos(angle)*rr;
var y=cy+Math.sin(angle)*rr;
ctx.beginPath();
ctx.arc(x,y,6,0,Math.PI*2);
ctx.fillStyle='#2e7d32';
ctx.fill();
ctx.strokeStyle='#fff';
ctx.lineWidth=2;
ctx.stroke();
}

// 标签
ctx.font='600 24px PingFang SC,sans-serif';
ctx.textAlign='center';
ctx.textBaseline='middle';
for(var i=0;i<n;i++){
var angle=-Math.PI/2+Math.PI*2*i/n;
var lr=r+36;
var x=cx+Math.cos(angle)*lr;
var y=cy+Math.sin(angle)*lr;
ctx.fillStyle='#1b3a1b';
ctx.fillText(labels[i],x,y);
ctx.font='700 18px Arial,sans-serif';
ctx.fillStyle='#2e7d32';
ctx.fillText(Math.round(values[i]*100)+'',x,y+24);
ctx.font='600 24px PingFang SC,sans-serif';
}
}

function shareResult(){
if(navigator.share){navigator.share({title:'你天生该吃哪碗饭？',text:'我的职业基因是'+getType()+'！你也来试试',url:location.href})}
else{navigator.clipboard.writeText(location.href).then(function(){showToast('✅ 链接已复制，去分享给朋友吧！')})}
}

function showToast(msg){var t=document.createElement('div');t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;z-index:9999';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2000)}
</script>
