  {t:"能欣赏对方的模式，甚至借来用在自己需要的场景",s:4},

{dim:"growth",t:"看到同龄人比你成功，你——",o:[
  {t:"酸，然后emo",s:1},
  {t:"酸，但会自我安慰「各人有各命」",s:2},
  {t:"有自己的节奏感，真心祝福+选择性学习",s:4},
  {t:"能把刺痛转化成具体行动参考",s:3}]},
{dim:"growth",t:"过去一年，你——",o:[
  {t:"感觉在原地打转",s:1},
  {t:"想改变，但不知道从哪开始",s:2},
  {t:"在某方面有意识地突破过自己",s:3},
  {t:"定期复盘迭代，能说出去年到现在自己的3个变化",s:4}]},
{dim:"growth",t:"你目前的人生状态——",o:[

const DIMS = {

    low:{lv:"起步区",d:"你对自己的了解，大多来自别人的反馈——而且听到时第一反应是否认。情绪来了就是来了，你很少问「它从哪来」。这不是你的错，只是没人教过你往内看。"},
    mid:{lv:"觉察中",d:"你看得见自己的一部分模式了——知道自己在意什么、怕什么。但还有些自动反应，总是在事后才被你发现。觉察像手电筒，你有了，只是光还不够稳。"},
    high:{lv:"清醒者",d:"你对自己的应激模式如数家珍：被否定时会怎样、压力大时会怎样。这份「自我说明书」让你在关系和职场里少踩了很多坑，同类型中这是稀缺能力。"}},
    key:"每晚睡前问一句：今天我最强烈的情绪是什么？它想告诉我什么？"},
  emotion:{name:"情绪管理",icon:"🌊",levels:{
    low:{lv:"被带走",d:"情绪来了，你基本是被冲走的那一个——反刍、爆发、或者假装没事。你不是没感觉，是感觉太满没有出口，身体常常替情绪买单：失眠、暴食、莫名的累。"},
    mid:{lv:"能接住",d:"你能接住情绪的大多数——会压一压、会找人聊、能睡一觉翻篇。但极端情况下（被当众否定、被亲近的人伤害），你还是会宕机。"},
    high:{lv:"驭浪者",d:"你已经能和情绪共处：它来，你看着它来；它走，你目送它走。吵架能复盘，崩溃有预案。这份稳定感，是别人愿意靠近你的原因。"}},
    key:"给情绪一个物理出口——运动、写下来、哭一场都行。情绪要的是流动，不是消灭。"},
  boundary:{name:"边界感",icon:"🛡️",levels:{
    low:{lv:"无界",d:"你的口头禅是「算了」。别人越界，你忍；自己的事被插手，你也忍。忍到一定程度不是爆发就是消失。你的善良，经常被当成免费资源。"},
    mid:{lv:"立界中",d:"你知道自己的边界在哪，也在试着维护——表达过、拒绝过，但效果时好时坏，遇到强势的人还是容易让步。"},
    high:{lv:"护城河",d:"你的边界清晰而温和：能挡住越界的人，还不伤关系。你早就明白——先照顾好自己，才有能力照顾别人。"}},
    key:"练习说一次「这次不行」，不用解释理由，说完就走。"},
  flex:{name:"功能整合",icon:"⚖️",levels:{
    low:{lv:"单模式",d:"你基本只用熟悉的那一面活着——i人从不主动社交，计划被打乱就崩溃。不是不能，是「那样不像我」。可惜世界不按你的型号出牌。"},
    mid:{lv:"能切换",d:"需要的时候你能切换——该上场的上场，该配合的配合。但切换很耗电，事后需要大量回血。你还在「能」和「自如」之间。"},
    high:{lv:"收放自如",d:"该e时能点亮全场，散场后能安静回血；计划被打乱，顺手就重排。你不被「型号」定义——型号只是你的默认设置，不是天花板。"}},
    key:"本月做一件「不像你」的事：装一次e、即兴一次、开口求助一次。"},
  growth:{name:"成长思维",icon:"🌱",levels:{
    low:{lv:"待点火",d:"回头看，这几年好像在原地打转。想改变的念头总被「算了」掐灭。你不是没能力，是主动权一直在别人手里——公司、家人、惯性。"},
    mid:{lv:"在路上了",d:"你在某些方面已经突破过自己——那次转行、那次开口、那次坚持。但整体节奏还是「被动+偶尔反击」。你知道自己在变好，只是还不够稳。"},
    high:{lv:"掌舵人",d:"你定期复盘、持续迭代，能清楚说出自己去年的三个变化。你掌着自己的舵——哪怕慢，方向是自己定的。同类型中这是前15%。"}},
    key:"选一件小事，完全按自己的意思做成它。主动权是从最小的胜利里长出来的。"}
};

const TIERS = [
  {min:46,max:60,icon:"👑",name:"高阶",title:"觉醒者",color:"#f5c842",pct:"前15%",
   quote:"你身上有一种罕见的诚实——对自己的诚实。",
   desc:"你不是没有情绪和软肋，而是已经能看见它们、使用它们。你的答案里几乎没有「假装没事」和「骗自己」，这份自我诚实就是高阶的门票。同类型中只有约15%的人走到这里。",
   next:"你的下一步不是继续向上，而是向下——去带人、去托举。高阶的尽头，是成为别人的阶梯。"},
  {min:32,max:45,icon:"⭐",name:"中阶",title:"进化中",color:"#a78bfa",pct:"占同类型约65%",
   quote:"你已经上路了，只是还在爬坡。",
   desc:"你不是不够好，是还差几次「抓到自己现行」的经验。你能看见自己的大部分模式，但还有些自动反应，在你没察觉时就接管了你。",
   next:"这一阶最大的坑叫「已经不错了」——它会让进化停在半山腰。保持自问，别让舒适偷走你的下一阶。"},
  {min:23,max:31,icon:"🧭",name:"低阶",title:"蓄力期",color:"#7dd3fc",pct:"占同类型约20%",
   quote:"低阶不等于差劲，它只说明你的能量还压在潜意识里。",
   desc:"不是没有觉察，是还没开始用。同类型中约20%的人在这里——这不是落后，是还没点火。",
   next:"你最大的优势：从低阶到中阶的路径极其清晰。每一次「我为什么这么做」的自问，都是实打实的升级点。升阶比你想象的快。"},
  {min:15,max:22,icon:"🌱",name:"未觉醒",title:"隐藏款",color:"#9ca3af",pct:"全网不到2%",
   quote:"看到这个结果的瞬间，觉察已经开始了。",
   desc:"全网不到2%的人会打开这个结果——要么你诚实到可怕，要么你正处于人生的疲惫期。无论是哪种，都不是终点。",
   next:"看见即改变。今天这个结果，就是你升阶的第一步。"}
];

/* ============ 逻辑 ============ */
let selectedType = null, answers = [], curQ = 0;
const $ = id => document.getElementById(id);

(function initTypes(){
  const codes = Object.keys(TYPES);
  const grid = $("typeGrid");
  codes.forEach(c=>{
    const d = document.createElement("div");
    d.className = "type-cell"; d.textContent = c;
    d.onclick = ()=>{ selectedType = c; document.querySelectorAll(".type-cell").forEach(x=>x.classList.remove("selected")); d.classList.add("selected"); $("btnStart").disabled = false; };
    grid.appendChild(d);
  });
  const u = document.createElement("div");
  u.className = "type-cell unknown"; u.textContent = "不确定";
  u.style.gridColumn = "span 2";
  u.onclick = ()=>{ selectedType = "未知型"; document.querySelectorAll(".type-cell").forEach(x=>x.classList.remove("selected")); u.classList.add("selected"); $("btnStart").disabled = false; };
  grid.appendChild(u);
})();

$("btnStart").onclick = ()=>{ $("cover").style.display="none"; $("quiz").style.display="flex"; curQ=0; answers=[]; showQ(); };

function showQ(){
  const q = QUESTIONS[curQ];
  $("progressFill").style.width = ((curQ)/15*100)+"%";
  $("progressNum").textContent = (curQ+1)+" / 15";
  $("quizType").textContent = selectedType;
  $("qNum").textContent = "Q"+(curQ+1)+" · "+DIMS[q.dim].icon+" "+DIMS[q.dim].name;
  $("qTitle").textContent = q.t;
  const box = $("options"); box.innerHTML="";
  q.o.forEach((opt,i)=>{
    const d = document.createElement("div");
    d.className = "option fadeIn";
    d.innerHTML = '<div class="opt-label">'+"ABCD"[i]+'</div><div class="opt-text">'+opt.t+'</div>';
    d.onclick = ()=>{ answers[curQ]=opt.s; curQ++; if(curQ>=15){renderResult();}else{showQ();} };
    box.appendChild(d);
  });
}

function renderResult(){
  $("quiz").style.display="none";
  $("result").style.display="flex";
  const total = answers.reduce((a,b)=>a+b,0);
  const T = TIERS.find(t=>total>=t.min && total<=t.max);
  /* 维度分 */
  const dimScores = {};
  Object.keys(DIMS).forEach(k=>dimScores[k]=0);
  QUESTIONS.forEach((q,i)=>dimScores[q.dim]+=answers[i]);
  /* 同型对比伪百分比 */
  const beat = Math.min(97, Math.max(8, Math.round(total/60*100)));
  const typeData = TYPES[selectedType];
  const typeName = typeData ? selectedType+" · "+typeData.n : selectedType;

  let html = '<div class="r-icon">'+T.icon+'</div>';
  html += '<div class="r-label">'+typeName+' 的心智阶位</div>';
  html += '<div class="r-title">'+T.name+' · '+T.title+'</div>';
  html += '<div class="r-badge" style="background:'+T.color+'22;color:'+T.color+';border:1px solid '+T.color+'55">'+T.pct+' · 综合得分 '+total+'/60</div>';
  html += '<div class="r-percent">超过了同类型约 '+beat+'% 的人</div>';

  /* 阶位解读 */
  html += '<div class="r-card fadeIn"><div class="rc-title"><span class="rc-icon">📜</span>阶位解读</div>';
  html += '<div class="r-quote">'+(T.quote||"每一个阶位，都藏着它的礼物。")+'</div>';
  html += '<div class="dim-detail-desc">'+T.desc+'</div>';
  html += '<div class="dim-detail-tip"><b>▸ 下一阶的方向：</b>'+T.next+'</div></div>';

  /* 雷达图 */
  html += '<div class="r-card fadeIn"><div class="rc-title"><span class="rc-icon">📊</span>五维心智雷达</div><div class="radar-wrap">'+buildRadar(dimScores)+'</div></div>';

  /* 维度详情 */
  html += '<div class="r-card fadeIn"><div class="rc-title"><span class="rc-icon">🔬</span>维度深度解析</div>';
  Object.keys(DIMS).forEach(k=>{
    const dim = DIMS[k], sc = dimScores[k];
    const pct = Math.round((sc-3)/9*100);
    const lvKey = sc>=10?"high":(sc>=7?"mid":"low");
    const lv = dim.levels[lvKey];
    html += '<div class="dim-detail">';
    html += '<div class="dim-detail-head"><span class="dim-detail-icon">'+dim.icon+'</span><span class="dim-detail-name">'+dim.name+'</span><span class="dim-detail-score">'+sc+'/12</span><span class="dim-detail-level lv-'+lvKey+'">'+lv.lv+'</span></div>';
    html += '<div class="dim-detail-desc">'+lv.d+'</div>';
    html += '<div class="dim-detail-tip"><b>🗝️ 升阶钥匙：</b>'+dim.key+'</div>';
    html += '</div>';
  });
  html += '</div>';

  /* 型号专属 */
  if(typeData){
    html += '<div class="r-card fadeIn type-block">';
    html += '<div class="tb-head">'+T.icon+' '+selectedType+' 型的升阶地图</div>';
    html += '<div class="tb-row"><div class="tb-label">◆ 你的高阶画像</div><div class="tb-text">'+typeData.high+'</div></div>';
    html += '<div class="tb-row"><div class="tb-label">◆ 你的升阶关键</div><div class="tb-text">'+typeData.path+'</div></div>';
    html += '</div>';
  } else {
    html += '<div class="r-card fadeIn type-block"><div class="tb-head">🧩 下一步</div><div class="tb-text">先去测出自己的MBTI型号，再回来重测一次——不同型号的升阶路径完全不同，找到你的专属地图。</div></div>';
  }

  /* 弱项提示 */
  const weakest = Object.keys(dimScores).sort((a,b)=>dimScores[a]-dimScores[b])[0];
  html += '<div class="r-card fadeIn"><div class="rc-title"><span class="rc-icon">⚡</span>你的突破口</div><div class="dim-detail-desc">五个维度中，<b style="color:'+T.color+'">'+DIMS[weakest].name+'</b>是你目前拖后腿的一项。先攻它——一个维度的提升会带动整体阶位上涨，这是最快的路径。</div></div>';

  html += '<button class="btn-retry" onclick="location.reload()">↻ 重新测评</button>';
  html += '<div class="r-disclaimer">本测评基于心智成熟度行为学框架，结果仅供自我探索参考<br>© 西西崽测评 NO.008 · MBTI心智阶位</div>';
  $("result").innerHTML = html;
  window.scrollTo(0,0);
}

function buildRadar(dimScores){
  const cx=140, cy=140, R=100;
  const keys = Object.keys(DIMS);
  const N = keys.length;
  let svg = '<svg class="radar-svg" viewBox="0 0 280 280">';
  for(let ring=1; ring<=4; ring++){
    const r = R*ring/4;
    let pts=[];
    for(let i=0;i<N;i++){ const ang = -Math.PI/2 + i*2*Math.PI/N; pts.push((cx+r*Math.cos(ang)).toFixed(1)+","+(cy+r*Math.sin(ang)).toFixed(1)); }
    svg += '<polygon points="'+pts.join(" ")+'" fill="none" stroke="rgba(139,92,246,0.18)" stroke-width="1"/>';
  }
  for(let i=0;i<N;i++){ const ang = -Math.PI/2 + i*2*Math.PI/N;
    svg += '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(ang)).toFixed(1)+'" y2="'+(cy+R*Math.sin(ang)).toFixed(1)+'" stroke="rgba(139,92,246,0.18)" stroke-width="1"/>';
    const lx = cx+(R+18)*Math.cos(ang), ly = cy+(R+16)*Math.sin(ang);
    svg += '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" fill="#a5a3c7" font-size="10.5" text-anchor="middle" dominant-baseline="middle">'+DIMS[keys[i]].name+'</text>';
  }
  let pts=[];
  keys.forEach((k,i)=>{ const ang = -Math.PI/2 + i*2*Math.PI/N; const r = R*(dimScores[k]-3)/9; pts.push((cx+r*Math.cos(ang)).toFixed(1)+","+(cy+r*Math.sin(ang)).toFixed(1)); });
  svg += '<polygon points="'+pts.join(" ")+'" fill="rgba(245,200,66,0.25)" stroke="#f5c842" stroke-width="2" stroke-linejoin="round"/>';
  pts.forEach(p=>{ const xy=p.split(","); svg += '<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="3" fill="#f5c842"/>'; });
  svg += '</svg>';
  return svg;
}
