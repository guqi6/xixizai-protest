// === 测试逻辑 ===
var currentQ = 0;
var scores = {social:0,report:0,control:0,duty:0,meaning:0,env:0};

function startQuiz(){
  currentQ = 0;
  scores = {social:0,report:0,control:0,duty:0,meaning:0,env:0};
  document.getElementById('page-cover').style.display='none';
  document.getElementById('page-result').style.display='none';
  document.getElementById('page-quiz').style.display='flex';
  renderQuestion();
}

function renderQuestion(){
  var q = questions[currentQ];
  var total = questions.length;
  var progress = (currentQ / total) * 100;
  
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('progressLabel').textContent = '第 ' + (currentQ+1) + ' 题';
  document.getElementById('progressCount').textContent = (currentQ+1) + ' / ' + total;
  document.getElementById('qNum').textContent = '问题 ' + (currentQ+1);
  document.getElementById('qTitle').textContent = q.q;
  
  var optsHtml = '';
  var labels = ['A','B','C','D'];
  q.opts.forEach(function(o,i){
    optsHtml += '<div class="option fadeIn" onclick="selectOption(\''+o.type+'\')">' +
      '<div class="opt-label">'+labels[i]+'</div>' +
      '<div class="opt-text">'+o.t+'</div>' +
      '</div>';
  });
  document.getElementById('qOptions').innerHTML = optsHtml;
}

function selectOption(type){
  scores[type]++;
  currentQ++;
  if(currentQ >= questions.length){
    showResult();
  } else {
    window.scrollTo(0,0);
    renderQuestion();
  }
}

function showResult(){
  // 找到最高分
  var maxType = 'social', maxScore = 0;
  var sorted = [];
  for(var k in scores){
    sorted.push({type:k,score:scores[k]});
    if(scores[k] > maxScore){maxScore = scores[k]; maxType = k;}
  }
  sorted.sort(function(a,b){return b.score - a.score});
  
  var r = results[maxType];
  var secondaryType = sorted[1].type;
  
  document.getElementById('page-quiz').style.display='none';
  document.getElementById('page-result').style.display='flex';
  document.getElementById('rIcon').textContent = r.icon;
  document.getElementById('rTitle').textContent = r.title;
  document.getElementById('rBadge').textContent = r.badge;
  
  // 描述 + 金句
  var descHtml = r.desc.split('\n').map(function(p){return p.trim()?'<p style="margin-bottom:10px">'+p+'</p>':''}).join('');
  descHtml += '<div class="r-quote">「'+r.quote+'」</div>';
  document.getElementById('rDesc').innerHTML = descHtml;
  
  // 最耗电场景
  var scenarioHtml = '<div class="section-title" style="color:#e65100">⚡ 最耗电场景 Top3</div>';
  r.scenarios.forEach(function(s,i){scenarioHtml+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="width:24px;height:24px;border-radius:50%;background:#f59e0b;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700">'+(i+1)+'</span><span style="font-size:14px;color:var(--text)">'+s+'</span></div>'});
  document.getElementById('rScenarios').innerHTML = scenarioHtml;
  
  // 适合的工作机制
  var fitHtml = '<div class="section-title" style="color:#1d4ed8">✅ 适合你的工作机制</div>';
  r.fit.forEach(function(f){fitHtml+='<div style="font-size:14px;color:var(--text);margin-bottom:6px;padding-left:20px;position:relative"><span style="position:absolute;left:0;color:#3b82f6">✓</span>'+f+'</div>'});
  document.getElementById('rFit').innerHTML = fitHtml;
  
  // 职场雷区
  var trapHtml = '<div class="section-title" style="color:#dc2626">⚠️ 职场雷区</div>';
  r.traps.forEach(function(t){trapHtml+='<div style="font-size:14px;color:#991b1b;margin-bottom:6px;padding-left:20px;position:relative"><span style="position:absolute;left:0;color:#ef4444">✗</span>'+t+'</div>'});
  document.getElementById('rTraps').innerHTML = trapHtml;
  
  // 充电方式
  document.getElementById('rCharge').innerHTML = '<div class="section-title" style="color:#3b82f6">🔋 你的充电方式</div><div style="font-size:15px;color:var(--text);font-weight:500">'+r.charge+'</div>';
  
  // 次要耗电类型
  document.getElementById('rSecondary').textContent = '你的次要耗电点是「'+dimNames[secondaryType]+'」';
  
  // 存到全局供分享图用
  window._resultData = r;
  window._resultType = maxType;
}

function resetQuiz(){
  document.getElementById('page-result').style.display='none';
  document.getElementById('page-cover').style.display='flex';
}

// === 分享图生成 ===
function showShare(){
  document.getElementById('shareModal').classList.add('show');
  drawShareCard();
}
function closeShare(){
  document.getElementById('shareModal').classList.remove('show');
}
function drawShareCard(){
  var canvas = document.getElementById('shareCanvas');
  var ctx = canvas.getContext('2d');
  var W = 360, H = 540;
  var r = window._resultData || results.social;
  
  // 背景
  var grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#0f172a');
  grad.addColorStop(0.5,'#1e293b');
  grad.addColorStop(1,'#1e3a5f');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  
  // 网格
  ctx.strokeStyle = 'rgba(59,130,246,0.08)';
  ctx.lineWidth = 1;
  for(var x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  
  // 标签
  ctx.fillStyle = 'rgba(59,130,246,.15)';
  ctx.strokeStyle = '#60a5fa';
  ctx.lineWidth = 1.5;
  roundRect(ctx,28,36,90,26,5);
  ctx.fill();ctx.stroke();
  ctx.fillStyle = '#60a5fa';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('职场耗电点', 40, 53);
  ctx.fillStyle = '#60a5fa';
  ctx.font = '12px sans-serif';
  ctx.fillText('NO.004', W-70, 53);
  
  // 图标
  ctx.font = '56px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(r.icon, W/2, 160);
  
  // 标签
  ctx.fillStyle = '#94a3b8';
  ctx.font = '13px sans-serif';
  ctx.fillText('你的职场耗电点是', W/2, 200);
  
  // 标题
  ctx.fillStyle = '#f8fafc';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText(r.title, W/2, 238);
  
  // badge
  ctx.fillStyle = '#3b82f6';
  var bw = ctx.measureText(r.badge).width + 24;
  roundRect(ctx,(W-bw)/2,258,bw,26,13);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText(r.badge, W/2, 275);
  
  // 充电方式
  ctx.fillStyle = 'rgba(148,163,184,.8)';
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('🔋 充电方式：', 40, 330);
  var chargeLines = r.charge.match(/.{1,16}/g) || [];
  chargeLines.slice(0,3).forEach(function(line,i){
    ctx.fillText(line, 40, 352+i*20);
  });
  
  // 二维码占位
  ctx.fillStyle = '#fff';
  roundRect(ctx,W/2-40,440,80,80,12);
  ctx.fill();
  ctx.fillStyle = '#3b82f6';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('扫码来测', W/2, 470);
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText('⚡', W/2, 500);
  
  ctx.fillStyle = 'rgba(148,163,184,.3)';
  ctx.font = '10px sans-serif';
  ctx.fillText('protest.xixizai.com', W/2, 528);
  ctx.textAlign = 'left';
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function downloadShare(){
  var canvas = document.getElementById('shareCanvas');
  var link = document.createElement('a');
  link.download = '我的职场耗电点测试结果.png';
  link.href = canvas.toDataURL();
  link.click();
}
