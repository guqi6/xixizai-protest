<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{

}
body{

}
.bg{position:fixed;inset:0;z-index:-1;

}
.bg::before{content:"";position:absolute;inset:0;

  background-size:30px 30px;
}
.app{max-width:500px;margin:0 auto;min-height:100vh;position:relative}

/* === 封面页 === */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center}
.cover .tag{display:inline-flex;align-items:center;gap:8px;margin-bottom:32px}
.cover .tag-label{border:1.5px solid var(--primary-l);border-radius:6px;padding:3px 14px;font-size:13px;color:var(--primary-l);background:rgba(59,130,246,.1);font-weight:600}
.cover .tag-num{font-size:13px;color:var(--primary-l);font-weight:600}
.cover .tag-line{flex:1;width:60px;height:1px;background:var(--border);opacity:.5}
.cover h1{font-size:38px;font-weight:900;color:#f8fafc;line-height:1.3;margin-bottom:20px;letter-spacing:-1px}
.cover .subtags{display:flex;flex-direction:column;gap:6px;margin-bottom:48px}
.cover .subtag{font-size:15px;color:#cbd5e1}
.cover .quote-deco{position:absolute;right:24px;bottom:120px;font-size:64px;color:rgba(59,130,246,.1);font-weight:900;line-height:1}
.cover .footer-en{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:11px;color:rgba(148,163,184,.4);letter-spacing:3px}
.btn-start{
  background:var(--primary);color:#fff;border:none;

  cursor:pointer;transition:.3s;box-shadow:0 4px 20px rgba(59,130,246,.4);
}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(59,130,246,.5);background:var(--primary-d)}

/* === 答题页 === */
.quiz{display:none;flex-direction:column;min-height:100vh;padding:32px 24px}
.quiz .progress-wrap{margin-bottom:40px}
.quiz .progress-bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.quiz .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-l));border-radius:3px;transition:width .2s ease}
.quiz .progress-text{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:#94a3b8}
.quiz .q-num{font-size:13px;color:var(--primary-l);font-weight:600;margin-bottom:8px}
.quiz .q-title{font-size:24px;font-weight:800;color:#f8fafc;line-height:1.4;margin-bottom:32px}
.quiz .options{display:flex;flex-direction:column;gap:12px}
.quiz .option{
  background:var(--card-bg);border:2px solid transparent;
  border-radius:16px;padding:18px 20px;font-size:16px;color:var(--text);
  cursor:pointer;transition:.25s;display:flex;align-items:center;gap:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.1);
}
.quiz .option:hover{border-color:var(--primary);transform:translateX(4px);box-shadow:var(--shadow)}
.quiz .option:active{transform:scale(.98)}
.quiz .option .opt-label{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;background:rgba(59,130,246,.1);color:var(--primary);
  transition:.25s;
}
.quiz .option:hover .opt-label{background:var(--primary);color:#fff}
.quiz .option .opt-text{flex:1;font-weight:500}

/* === 结果页 === */
.result{display:none;flex-direction:column;align-items:center;min-height:100vh;padding:40px 24px;text-align:center;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%)}
.result .r-icon{font-size:72px;margin-bottom:16px;animation:bounceIn .6s ease}
.result .r-label{font-size:14px;color:#94a3b8;margin-bottom:8px}
.result .r-title{font-size:32px;font-weight:900;color:#f8fafc;margin-bottom:8px;line-height:1.3}
.result .r-badge{display:inline-block;background:var(--primary);color:#fff;font-size:12px;padding:4px 16px;border-radius:14px;margin-bottom:24px}

/* 结果卡片通用 */
.r-card{
  background:var(--card-bg);border-radius:16px;padding:20px;
  margin-bottom:14px;box-shadow:var(--shadow);text-align:left;width:100%;

.r-score-num{font-size:42px;font-weight:900;color:var(--primary);line-height:1}
.r-score-label{font-size:13px;color:var(--text-l);line-height:1.4}
.r-score-bar{flex:1;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.r-score-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px}

.dim-row{margin-bottom:12px}
.dim-row:last-child{margin-bottom:0}
.dim-head{display:flex;justify-content:space-between;margin-bottom:4px}
.dim-name{font-size:13px;font-weight:600;color:var(--text)}
.dim-val{font-size:13px;color:var(--text-l)}
.dim-bar{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.dim-fill{height:100%;border-radius:3px;transition:width .8s ease}
.dim-fill.high{background:linear-gradient(90deg,#ef4444,#f59e0b)}
.dim-fill.mid{background:linear-gradient(90deg,#f59e0b,#3b82f6)}
.dim-fill.low{background:linear-gradient(90deg,#3b82f6,#06b6d4)}

/* 引用框 */
.r-quote{
  border-left:3px solid var(--primary);background:rgba(59,130,246,.06);
  padding:12px 16px;margin:10px 0;border-radius:0 8px 8px 0;
  font-style:italic;color:var(--primary-d);font-size:14px;
}

/* 描述段落 */
.r-desc-p{font-size:15px;line-height:1.8;color:var(--text);margin-bottom:10px}

/* 场景列表 */
.scenario-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.scenario-num{width:24px;height:24px;border-radius:50%;background:#f59e0b;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;margin-top:2px}
.scenario-text{font-size:14px;color:var(--text);line-height:1.5}

/* 适合/雷区列表 */
.list-item{font-size:14px;color:var(--text);margin-bottom:8px;padding-left:22px;position:relative;line-height:1.5}
.list-check{position:absolute;left:0;color:#3b82f6;font-weight:700}
.list-cross{position:absolute;left:0;color:#ef4444;font-weight:700}

/* 充电方式 */
.charge-box{font-size:15px;color:var(--text);font-weight:500;line-height:1.6;padding:12px;background:rgba(59,130,246,.06);border-radius:10px}

/* 特质标签 */
.r-tags{display:flex;flex-wrap:wrap;gap:8px;width:100%;margin-bottom:14px}
.r-tag{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:var(--primary-d);font-size:13px;padding:6px 14px;border-radius:20px;font-weight:500}

.r-secondary{font-size:13px;color:#94a3b8;margin-bottom:24px}
.r-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px;margin-bottom:24px}
.btn-retry{background:transparent;color:var(--primary-l);border:2px solid var(--primary-l);padding:12px;border-radius:50px;font-size:14px;font-weight:600;cursor:pointer;transition:.3s}
.btn-retry:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

.section-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fadeIn{animation:fadeIn .2s ease}
</style>
</head>

// === 测试逻辑 ===
var currentQ = 0;
var scores = {social:0,report:0,control:0,duty:0,meaning:0,env:0};

function startQuiz(){
  currentQ = 0;
  scores = {social:0,report:0,control:0,duty:0,meaning:0,env:0};
  document.getElementById('page-cover').style.display='none';
  document.getElementById('page-result').style.display='none';
  document.getElementById('page-quiz').style.display='flex';
  renderQuestion();
}

function renderQuestion(){
  var q = questions[currentQ];
  var total = questions.length;
  var progress = (currentQ / total) * 100;
  
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('progressLabel').textContent = '第 ' + (currentQ+1) + ' 题';
  document.getElementById('progressCount').textContent = (currentQ+1) + ' / ' + total;
  document.getElementById('qNum').textContent = '问题 ' + (currentQ+1);
  document.getElementById('qTitle').textContent = q.q;
  
  var optsHtml = '';
  var labels = ['A','B','C','D'];
  q.opts.forEach(function(o,i){
    optsHtml += '<div class="option fadeIn" onclick="selectOption(\''+o.type+'\')">' +
      '<div class="opt-label">'+labels[i]+'</div>' +
      '<div class="opt-text">'+o.t+'</div>' +
      '</div>';
  });
  document.getElementById('qOptions').innerHTML = optsHtml;
}

function selectOption(type){
  scores[type]++;
  currentQ++;
  if(currentQ >= questions.length){
    showResult();
  } else {
    window.scrollTo(0,0);
    renderQuestion();
  }
}

function showResult(){
  // 找到排名
  var maxType = 'social', maxScore = 0;
  var sorted = [];
  for(var k in scores){
    sorted.push({type:k,score:scores[k]});
    if(scores[k] > maxScore){maxScore = scores[k]; maxType = k;}
  }
  sorted.sort(function(a,b){return b.score - a.score});
  
  var r = results[maxType];
  var secondaryType = sorted[1].type;
  
  document.getElementById('page-quiz').style.display='none';
  document.getElementById('page-result').style.display='flex';
  document.getElementById('rIcon').textContent = r.icon;
  document.getElementById('rTitle').textContent = r.title;
  document.getElementById('rBadge').textContent = r.badge;
  
  // 1. 耗电指数
  document.getElementById('rScoreBox').innerHTML = 
    '<div class="section-title" style="color:#1e293b">⚡ 耗电指数</div>' +
    '<div class="r-score-box">' +
      '<div class="r-score-num">'+r.score+'</div>' +
      '<div style="flex:1">' +
        '<div class="r-score-bar"><div class="r-score-fill" style="width:'+r.score+'%"></div></div>' +
        '<div class="r-score-label" style="margin-top:4px">极高度消耗 · 需要重视</div>' +
      '</div>' +
    '</div>';
  
  // 2. 6维度评分条
  var dimHtml = '<div class="section-title" style="color:#1e293b">📊 六维耗电分析</div>';
  sorted.forEach(function(item, i){
    var pct = Math.round(item.score / 15 * 100);
    var level = pct >= 50 ? 'high' : (pct >= 30 ? 'mid' : 'low');
    var barColor = i === 0 ? dimColors[item.type] : '';
    dimHtml += '<div class="dim-row">' +
      '<div class="dim-head"><span class="dim-name">'+dimNames[item.type]+(i===0?' ⚡':'')+'</span><span class="dim-val">'+item.score+'题 / '+pct+'%</span></div>' +
      '<div class="dim-bar"><div class="dim-fill '+level+'" style="width:'+pct+'%;'+(barColor?'background:'+barColor:'')+'"></div></div>' +
    '</div>';
  });
  document.getElementById('rDimensions').innerHTML = dimHtml;
  
  // 3. 核心描述 + 金句
  var descHtml = '';
  r.desc.split('\n').forEach(function(p){
    if(p.trim()){
      descHtml += '<p class="r-desc-p">'+p+'</p>';
    }
  });
  descHtml += '<div class="r-quote">「'+r.quote+'」</div>';
  document.getElementById('rDesc').innerHTML = descHtml;
  
  // 4. 耗电场景
  var scenarioHtml = '<div class="section-title" style="color:#e65100">⚡ 最耗电场景 Top3</div>';
  r.scenarios.forEach(function(s,i){
    scenarioHtml += '<div class="scenario-item"><span class="scenario-num">'+(i+1)+'</span><span class="scenario-text">'+s+'</span></div>';
  });
  document.getElementById('rScenarios').innerHTML = scenarioHtml;
  
  // 5. 适合的工作机制
  var fitHtml = '<div class="section-title" style="color:#1d4ed8">✅ 适合你的工作机制</div>';
  r.fit.forEach(function(f){
    fitHtml += '<div class="list-item"><span class="list-check">✓</span>'+f+'</div>';
  });
  document.getElementById('rFit').innerHTML = fitHtml;
  
  // 6. 职场雷区
  var trapHtml = '<div class="section-title" style="color:#dc2626">⚠️ 职场雷区</div>';
  r.traps.forEach(function(t){
    trapHtml += '<div class="list-item" style="color:#991b1b"><span class="list-cross">✗</span>'+t+'</div>';
  });
  document.getElementById('rTraps').innerHTML = trapHtml;
  
  // 7. 充电方式
  var chargeHtml = '<div class="section-title" style="color:#3b82f6">🔋 你的充电方式</div>';
  r.charge.split('\n').forEach(function(p){
    if(p.trim()){
      chargeHtml += '<p style="margin-bottom:8px">'+p+'</p>';
    }
  });
  document.getElementById('rCharge').innerHTML = chargeHtml;
  
  // 8. 特质标签
  var tagsHtml = '';
  r.tags.forEach(function(tag){
    tagsHtml += '<span class="r-tag">'+tag+'</span>';
  });
  document.getElementById('rTags').innerHTML = tagsHtml;
  
  // 9. 次要耗电类型
  document.getElementById('rSecondary').textContent = '你的次要耗电点是「'+dimNames[secondaryType]+'」';
}

function resetQuiz(){
  document.getElementById('page-result').style.display='none';
  document.getElementById('page-cover').style.display='flex';
  window.scrollTo(0,0);
}
