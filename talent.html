.quiz .progress-text{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--text-l)}
.quiz .q-num{font-size:13px;color:var(--primary);font-weight:600;margin-bottom:8px}

.quiz .option{

.quiz .option:hover .opt-label{background:var(--primary);color:#fff}

.quiz .option.selected{border-color:var(--primary);background:rgba(124,58,237,.05)}

/* 维度标签 */

.btn-share{background:var(--accent);color:#fff;border:none;padding:14px;border-radius:50px;font-size:15px;font-weight:700;cursor:pointer;transition:.3s;box-shadow:0 4px 16px rgba(245,158,11,.3)}

@keyframes bounceIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}

function startQuiz(){

function renderQuestion(){
  var q = questions[currentQ];
  var total = questions.length;
  var progress = (currentQ / total) * 100;
  
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('progressLabel').textContent = '第 ' + (currentQ+1) + ' 题';
  document.getElementById('progressCount').textContent = (currentQ+1) + ' / ' + total;
  document.getElementById('qNum').textContent = '问题 ' + (currentQ+1);
  document.getElementById('qTitle').textContent = q.q;
  document.getElementById('qTitle').classList.remove('fadeIn');
  void document.getElementById('qTitle').offsetWidth;
  document.getElementById('qTitle').classList.add('fadeIn');
  
  var optsHtml = '';
  var labels = ['A','B'];
  q.opts.forEach(function(o,i){
    optsHtml += '<div class="option fadeIn" onclick="selectOption('+i+')">' +
      '<div class="opt-label">'+labels[i]+'</div>' +
      '<div class="opt-text">'+o.t+'</div>' +
      '</div>';
  });
  document.getElementById('qOptions').innerHTML = optsHtml;
}

function selectOption(idx){
  var q = questions[currentQ];
  var opt = q.opts[idx];
  
  // 记录分数
  if(opt.val === 'A'){
    dimScores[opt.dim] += 1; // A=维度正向
  }
  dimCounts[opt.dim] += 1;
  
  // 选中动画
  var options = document.querySelectorAll('.option');
  options[idx].classList.add('selected');
  options.forEach(function(o){o.style.pointerEvents='none';});
  
  setTimeout(function(){
    currentQ++;
    if(currentQ >= questions.length){
      showResult();
    } else {
      window.scrollTo({top:0,behavior:'smooth'});
      renderQuestion();
    }
  },300);
}

function determineType(){
  // 判断每个维度是A还是B
  var dimLabels = {};
  for(var d in dimConfig){
    dimLabels[d] = dimScores[d] >= 2 ? 'A' : 'B'; // 3题中2题选A=A型
  }
  
  // 根据维度组合判断型格
  // 取分数最高的2个维度的组合
  var sorted = Object.keys(dimConfig).sort(function(a,b){
    return dimScores[b]-dimScores[a];
  });
  
  // 组合判断
  var top1 = sorted[0], top2 = sorted[1];
  
  // 特殊组合优先
  if(dimLabels.create==='A' && dimLabels.decide==='A') return 'breaker';
  if(dimLabels.decide==='B' && dimLabels.insight==='B') return 'sniper';
  if(dimLabels.social==='A' && dimLabels.resilience==='A') return 'resonator';
  if(dimLabels.decide==='A' && dimLabels.create==='B') return 'flash';
  if(dimLabels.insight==='A' && dimLabels.social==='A') return 'navigator';
  if(dimLabels.insight==='B' && dimLabels.resilience==='B') return 'cultivator';
  if(dimLabels.create==='A' && dimLabels.social==='A') return 'butterfly';
  if(dimLabels.resilience==='B' && dimLabels.social==='B') return 'guardian';
  
  // 兜底：根据最高维度+第二高判断
  if(dimScores[top1] >= 2){
    // 高分维度是A型
    if(top1==='create'||top1==='decide') return 'breaker';
    if(top1==='social'||top1==='insight') return 'navigator';
    return 'resonator';
  }
  // 都不高，默认守护者
  return 'guardian';
}

function drawShareCard(){
  var canvas = document.getElementById('shareCanvas');
  var ctx = canvas.getContext('2d');
  var W = 360, H = 540;
  
  var grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#f5f3ff');
  grad.addColorStop(0.5,'#ede9fe');
  grad.addColorStop(1,'#ddd6fe');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  
  ctx.strokeStyle = 'rgba(139,92,246,0.1)';
  ctx.lineWidth = 1;
  for(var x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#7c3aed';
  ctx.lineWidth = 1.5;
  ctx.font = '12px sans-serif';
  var tw = ctx.measureText('天赋型格').width + 24;
  roundRect(ctx, 28, 36, tw, 26, 5);
  ctx.fill();ctx.stroke();
  ctx.fillStyle = '#7c3aed';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('天赋型格', 40, 53);

}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

  link.click();
