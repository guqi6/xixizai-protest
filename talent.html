<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#f3e8ff;--bg2:#e9d5ff;--bg3:#ddd6fe;

body{

.bg{position:fixed;inset:0;z-index:-1;

}
.bg::before{content:"";position:absolute;inset:0;

}
.app{max-width:500px;margin:0 auto;min-height:100vh;position:relative}

/* === 封面页 === */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center}
.cover .tag{display:inline-flex;align-items:center;gap:8px;margin-bottom:32px}
.cover .tag-label{border:1.5px solid var(--primary);border-radius:6px;padding:3px 14px;font-size:13px;color:var(--primary);background:#fff;font-weight:600}
.cover .tag-num{font-size:13px;color:var(--text-l);font-weight:600}
.cover .tag-line{flex:1;width:60px;height:1px;background:var(--border)}
.cover h1{font-size:38px;font-weight:900;color:var(--primary-d);line-height:1.3;margin-bottom:20px;letter-spacing:-1px}
.cover .subtags{display:flex;flex-direction:column;gap:6px;margin-bottom:48px}
.cover .subtag{font-size:15px;color:var(--text-l)}
.cover .quote-deco{position:absolute;right:24px;bottom:120px;font-size:64px;color:rgba(124,58,237,.08);font-weight:900;line-height:1}
.cover .footer-en{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:11px;color:rgba(124,58,237,.35);letter-spacing:3px}
.btn-start{
  background:var(--primary);color:#fff;border:none;
  padding:16px 56px;border-radius:50px;font-size:17px;font-weight:700;

}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,58,237,.4);background:var(--primary-d)}
.btn-start:active{transform:translateY(0)}

/* === 答题页 === */
.quiz{display:none;flex-direction:column;min-height:100vh;padding:32px 24px}
.quiz .progress-wrap{margin-bottom:40px}
.quiz .progress-bar{height:6px;background:rgba(255,255,255,.5);border-radius:3px;overflow:hidden}
.quiz .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-l));border-radius:3px;transition:width .3s ease}
.quiz .progress-text{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--text-l)}
.quiz .q-num{font-size:13px;color:var(--primary);font-weight:600;margin-bottom:8px}
.quiz .q-title{font-size:24px;font-weight:800;color:var(--primary-d);line-height:1.4;margin-bottom:32px}
.quiz .options{display:flex;flex-direction:column;gap:12px}
.quiz .option{
  background:var(--card-bg);border:2px solid transparent;
  border-radius:16px;padding:20px;font-size:16px;color:var(--text-d);
  cursor:pointer;transition:.25s;display:flex;align-items:center;gap:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.04);position:relative;overflow:hidden;
}
.quiz .option:hover{border-color:var(--primary);transform:translateX(4px);box-shadow:var(--shadow)}
.quiz .option:active{transform:scale(.98)}
.quiz .option .opt-label{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;background:rgba(124,58,237,.1);color:var(--primary);
  transition:.25s;
}
.quiz .option:hover .opt-label{background:var(--primary);color:#fff}
.quiz .option .opt-text{flex:1;font-weight:500;line-height:1.5}
/* 选中动画 */
.quiz .option.selected{border-color:var(--primary);background:rgba(124,58,237,.05)}
.quiz .option.selected .opt-label{background:var(--primary);color:#fff}

/* 维度标签 */
.dim-label{font-size:12px;color:var(--text-l);margin-bottom:6px;display:flex;align-items:center;gap:6px}

/* === 结果页 === */
.result{display:none;flex-direction:column;align-items:center;min-height:100vh;padding:40px 24px;text-align:center}
.result .r-icon{font-size:72px;margin-bottom:16px;animation:bounceIn .6s ease}
.result .r-label{font-size:14px;color:var(--text-l);margin-bottom:8px}
.result .r-title{font-size:36px;font-weight:900;color:var(--primary-d);margin-bottom:8px;line-height:1.3}
.result .r-badge{display:inline-block;background:var(--primary);color:#fff;font-size:13px;padding:5px 18px;border-radius:14px;margin-bottom:24px;font-weight:600}
.result .r-card{
  background:var(--card-bg);border-radius:16px;padding:24px;width:100%;
  font-size:15px;line-height:1.8;color:var(--text-d);margin-bottom:16px;

.result .r-card-title{font-size:14px;font-weight:700;color:var(--primary-d);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.result .r-traits{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px}
.result .r-trait{background:rgba(124,58,237,.1);color:var(--primary-d);font-size:13px;padding:6px 16px;border-radius:16px;font-weight:600}
.result .r-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px;margin-bottom:24px}
.btn-share{background:var(--accent);color:#fff;border:none;padding:14px;border-radius:50px;font-size:15px;font-weight:700;cursor:pointer;transition:.3s;box-shadow:0 4px 16px rgba(245,158,11,.3)}
.btn-share:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(245,158,11,.4)}
.btn-retry{background:transparent;color:var(--primary);border:2px solid var(--primary);padding:12px;border-radius:50px;font-size:14px;font-weight:600;cursor:pointer;transition:.3s}
.btn-retry:hover{background:var(--primary);color:#fff}

/* 维度评分条 */
.score-row{margin-bottom:10px}
.score-row-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.score-row-name{color:var(--text-d);font-weight:600}
.score-row-val{color:var(--primary);font-weight:700}
.score-bar{height:6px;background:rgba(124,58,237,.1);border-radius:3px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:3px;transition:width 1s ease}

/* 分享图弹窗 */
.share-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;align-items:center;justify-content:center;padding:20px}
.share-modal.show{display:flex}
.share-card{background:#fff;border-radius:20px;overflow:hidden;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.share-card-img{width:100%;display:block}
.share-card-actions{padding:16px;display:flex;gap:12px}
.share-card-actions button{flex:1;padding:10px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.btn-dl{background:var(--primary);color:#fff}
.btn-close{background:#f0f0f0;color:#333}

@keyframes bounceIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fadeIn{animation:fadeIn .3s ease}

.dim-block{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(124,58,237,.06)}
.dim-block:last-child{border-bottom:none;margin-bottom:0}
.dim-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dim-name{font-weight:700;font-size:14px;color:var(--primary-d)}
.dim-level{font-size:12px;font-weight:600}
.dim-explain{font-size:13px;color:var(--text-d);line-height:1.7}
.career-item{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid rgba(124,58,237,.06)}

.avoid-item{margin-bottom:12px}

.avoid-why{font-size:12px;color:#991b1b;line-height:1.6}
.growth-item{display:flex;gap:10px;margin-bottom:10px}

.growth-text{font-size:13px;color:var(--text-d);line-height:1.6}
.r-rarity{font-size:12px;color:var(--text-l);margin-bottom:24px}
</style>
</head>

// === 题目数据：20题×4选项 ===
var questions = [
  {q:"朋友邀请你一起做个项目，你最兴奋的是哪种？",opts:[{t:"一个没人做过的方向，一切从零开始，我来定义规则",d:"create",p:3},{t:"一个已经有竞品的领域，但我觉得能做得更好更快",d:"decide",p:3},{t:"一个需要拉很多人一起玩的平台型项目",d:"social",p:3},{t:"一个有长期价值的方向，值得深耕十年",d:"insight",p:3}]},

  {q:"面对一个难题，你的第一反应是？",opts:[{t:"先干了再说，边做边找答案",d:"decide",p:3},{t:"找人聊聊，碰撞一下思路",d:"social",p:3},{t:"自己查资料研究，搞清楚再说",d:"insight",p:3},{t:"换个角度想，也许问题本身就是错的",d:"create",p:3}]},

  {q:"看到一个机会但信息不完整，你的选择是？",opts:[{t:"先干了再说，错过比试错更难受",d:"decide",p:3},{t:"先找人聊，看看有没有内部消息",d:"social",p:2},{t:"花时间研究，搞清楚再动手",d:"insight",p:3},{t:"想想有没有更有创意的切入点",d:"create",p:2}]},
  {q:"做一个重要决定，你更依赖什么？",opts:[{t:"直觉——第一感觉往往是对的",d:"decide",p:3},{t:"数据——用数字说话最靠谱",d:"insight",p:3},{t:"身边人的建议——他们看我的视角更客观",d:"social",p:3},{t:"类比——有没有类似的先例可以参考",d:"create",p:2}]},
  {q:"你做事情的方式更接近哪种？",opts:[{t:"快速出结果，然后在过程中迭代",d:"decide",p:3},{t:"先想清楚再动手，争取一步到位",d:"insight",p:3},{t:"拉一帮人一起做，分头推进",d:"social",p:2},{t:"先看看有没有人做过类似的，借鉴加创新",d:"create",p:2}]},
  {q:"面对高风险高回报和稳定但有天花板的路，你选？",opts:[{t:"高风险高回报——人生不搏不精彩",d:"decide",p:3},{t:"稳定的——先确保下限再说",d:"resilience",p:2},{t:"看身边有没有人一起冒险，有人陪才敢",d:"social",p:2},{t:"先分析风险到底有多大，值不值得赌",d:"insight",p:2}]},

  {q:"看一份报告或文章，你最关注什么？",opts:[{t:"底层逻辑——这说明什么趋势",d:"insight",p:3},{t:"具体方法——怎么做到的，我能复制吗",d:"decide",p:3},{t:"跟其他领域有没有可以连起来的点",d:"create",p:2},{t:"谁写的？作者的背景和立场是什么",d:"social",p:2}]},

// === 8种天赋型格数据 ===

      {name:"需要频繁社交的BD/销售",why:"这些岗位需要每天认识新人不断拓展人脉。你的社交能量消耗很快长期做会很累。"},
      {name:"高度创新驱动的创意岗",why:"这些岗位要求你不断打破常规产出新想法。你的天赋在于稳定执行而非天马行空。"},
      {name:"竞争激烈淘汰率高的行业",why:"这些行业要求你主动出击抢资源。你的性格是防守型的在进攻型环境里会被边缘化。"}
    ],
    traps:["容易被忽视不善于展示自己的价值","过于保守错过该冒险的时机","不善于说不容易被当成万能工具人","在需要主动出击的时候不够积极","变化太快的场景会让你不适应"],
    growth:["学会展示自己的价值定期跟上级同步贡献和成果","在稳定中找微小创新的机会","建立个人品牌让别人看到你","学会说这个不是我的职责","适当冒险走出舒适区你会发现你比想象中强"],
    scene:"公司突然出大事所有人都在慌。你没有说话默默地把关键系统备份了客户安抚了流程梳理了。等大家回过神来发现事情已经被你处理好了。你笑了笑回到座位继续干活。",
    match:{best:"破局者🔥 —— ta负责冲锋你负责守阵地",conflict:"破局者🔥 —— 如果双方都不退让会互相消耗"},
    famous:"典型代表：Tim Cook、稻盛和夫",
    traits:["稳如磐石","深度可靠","系统守护者","默默扛事","极低失误率"]
  }
};

// === 维度配置 ===
var dimConfig = {
  create:{name:"创造力",icon:"🎨"},
  decide:{name:"决策力",icon:"⚡"},
  social:{name:"社交力",icon:"🤝"},
  resilience:{name:"韧性",icon:"💪"},
  insight:{name:"洞察力",icon:"🔮"}
};

// === 测试逻辑 ===
var currentQ = 0;
var dimScores = {create:0,decide:0,social:0,resilience:0,insight:0};

function startQuiz(){
  currentQ = 0;
  dimScores = {create:0,decide:0,social:0,resilience:0,insight:0};
  document.getElementById('page-cover').style.display='none';
  document.getElementById('page-result').style.display='none';
  document.getElementById('page-quiz').style.display='flex';
  renderQuestion();
}

function renderQuestion(){
  var q = questions[currentQ];
  var total = questions.length;
  var progress = (currentQ / total) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('progressLabel').textContent = '第 ' + (currentQ+1) + ' 题';
  document.getElementById('progressCount').textContent = (currentQ+1) + ' / ' + total;
  document.getElementById('qNum').textContent = '问题 ' + (currentQ+1);
  document.getElementById('qTitle').textContent = q.q;
  document.getElementById('qTitle').classList.remove('fadeIn');
  void document.getElementById('qTitle').offsetWidth;
  document.getElementById('qTitle').classList.add('fadeIn');
  var optsHtml = '';
  var labels = ['A','B','C','D'];
  q.opts.forEach(function(o,i){
    optsHtml += '<div class="option fadeIn" onclick="selectOption('+i+')"><div class="opt-label">'+labels[i]+'</div><div class="opt-text">'+o.t+'</div></div>';
  });
  document.getElementById('qOptions').innerHTML = optsHtml;
}

function selectOption(idx){
  var q = questions[currentQ];
  var opt = q.opts[idx];
  dimScores[opt.d] = (dimScores[opt.d]||0) + opt.p;
  var options = document.querySelectorAll('.option');
  options[idx].classList.add('selected');
  options.forEach(function(o){o.style.pointerEvents='none';});
  setTimeout(function(){
    currentQ++;
    if(currentQ >= questions.length){showResult();}
    else{window.scrollTo({top:0,behavior:'smooth'});renderQuestion();}
  },300);
}

function determineType(){
  var sorted = Object.keys(dimConfig).sort(function(a,b){return dimScores[b]-dimScores[a];});
  var top1 = sorted[0], top2 = sorted[1];
  var set = top1 < top2 ? top1+'+'+top2 : top2+'+'+top1;
  var pairMap = {
    'create+decide':'breaker',
    'decide+insight':'sniper',
    'resilience+social':'resonator',
    'decide+social':'flash',
    'insight+social':'navigator',
    'insight+resilience':'cultivator',
    'create+social':'butterfly',
    'create+insight':'navigator',
    'create+resilience':'guardian',
    'decide+resilience':'guardian'
  };
  if(pairMap[set]) return pairMap[set];
  if(top1==='create') return 'breaker';
  if(top1==='decide') return 'flash';
  if(top1==='social') return 'resonator';
  if(top1==='insight') return 'navigator';
  return 'guardian';
}

function showResult(){
  try {
  var typeKey = determineType();
  console.log('determineType result:', typeKey, 'dimScores:', JSON.stringify(dimScores));
  if(!typeKey || !types[typeKey]){
    console.error('型格判定失败! typeKey=', typeKey);
    typeKey = 'breaker';
  }
  var t = types[typeKey];
  if(!t){
    console.error('型格数据不存在!', typeKey);
    document.getElementById('page-quiz').style.display='none';
    document.getElementById('page-result').style.display='flex';
    document.getElementById('rIcon').textContent = '🔮';
    document.getElementById('rTitle').textContent = '测试出错';
    document.getElementById('rDesc').innerHTML = '<p>抱歉，测试结果加载失败。请刷新页面重试。</p>';
    return;
  }
  document.getElementById('page-quiz').style.display='none';
  document.getElementById('page-result').style.display='flex';
  document.getElementById('rIcon').textContent = t.icon;
  document.getElementById('rTitle').textContent = t.title;
  document.getElementById('rBadge').textContent = t.badge;
  document.getElementById('rRarity').textContent = t.rarity || '';

  // 描述
  var descHtml = t.desc.split('\n').map(function(p){return p.trim()?'<p style="margin-bottom:10px">'+p+'</p>':''}).join('');
  if(t.quote) descHtml += '<blockquote style="border-left:3px solid var(--primary);background:rgba(124,58,237,.06);padding:12px 16px;margin:16px 0;border-radius:0 8px 8px 0;font-style:italic;color:var(--primary-d)">「'+t.quote+'」</blockquote>';
  document.getElementById('rDesc').innerHTML = descHtml;

  // 评分条
  var scoreHtml = '<div class="r-card-title">📊 天赋维度评分</div>';
  var dims = [{k:'create',n:'创造力',icon:'🎨'},{k:'decide',n:'决策力',icon:'⚡'},{k:'social',n:'社交力',icon:'🤝'},{k:'resilience',n:'韧性',icon:'💪'},{k:'insight',n:'洞察力',icon:'🔮'}];
  dims.forEach(function(d){
    var v = t.scores[d.k];
    var label = v>=85?'极强':v>=70?'中高':v>=55?'中等':'偏弱';
    var color = v>=85?'var(--primary)':v>=70?'var(--primary-l)':v>=55?'#a78bfa':'#c4b5fd';
    scoreHtml += '<div class="score-row"><div class="score-row-head"><span class="score-row-name">'+d.icon+' '+d.n+'</span><span class="score-row-val">'+label+' '+v+'</span></div><div class="score-bar"><div class="score-bar-fill" style="width:'+v+'%;background:'+color+'"></div></div></div>';
  });
  document.getElementById('rScores').innerHTML = scoreHtml;

  // 维度详解
  if(t.dimDetail){
    var dimHtml = '<div class="r-card-title">🔍 你的5大天赋维度详解</div>';
    dims.forEach(function(d){
      var v = t.scores[d.k];
      var label = v>=85?'极强':v>=70?'中高':v>=55?'中等':'偏弱';
      var lc = v>=85?'var(--primary)':v>=70?'var(--primary-l)':v>=55?'#a78bfa':'#c4b5fd';
      dimHtml += '<div class="dim-block"><div class="dim-head"><span class="dim-name">'+d.icon+' '+d.n+'</span><span class="dim-level" style="color:'+lc+'">'+label+' '+v+'</span></div><div class="dim-explain">'+(t.dimDetail[d.k]||'')+'</div></div>';
    });
    document.getElementById('rDimDetail').innerHTML = dimHtml;
  }

  // 核心优势
  var strHtml = '<div class="r-card-title">💪 核心优势</div>';
  t.strengths.forEach(function(s){strHtml += '<div style="font-size:13px;color:var(--text-d);margin-bottom:8px;padding-left:20px;position:relative;line-height:1.6"><span style="position:absolute;left:0;color:var(--primary)">✦</span>'+s+'</div>';});
  document.getElementById('rStrengths').innerHTML = strHtml;

  // 适合职业
  var careerHtml = '<div class="r-card-title">🎯 最适合你的职业方向</div>';
  t.careers.forEach(function(c,i){
    careerHtml += '<div class="career-item"><div class="career-name"><span style="width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:700">'+(i+1)+'</span> '+c.name+'</div><div class="career-why">'+c.why+'</div></div>';
  });
  document.getElementById('rCareers').innerHTML = careerHtml;

  // 不适合职业
  var avoidHtml = '<div class="r-card-title" style="color:#dc2626">🚫 不适合你的职业方向</div>';
  avoidHtml += '<div style="font-size:12px;color:#7f1d1d;margin-bottom:10px;line-height:1.6">以下方向跟你的天赋型格冲突较大，选择前请慎重考虑：</div>';
  t.avoidCareers.forEach(function(c){
    avoidHtml += '<div class="avoid-item"><div class="avoid-name">✕ '+c.name+'</div><div class="avoid-why">'+c.why+'</div></div>';
  });
  document.getElementById('rAvoid').innerHTML = avoidHtml;

  // 盲区
  var trapHtml = '<div class="r-card-title" style="color:var(--warning)">⚠️ 你容易踩的盲区</div>';
  t.traps.forEach(function(tp){trapHtml += '<div style="font-size:13px;color:#9a3412;margin-bottom:6px;padding-left:16px;position:relative;line-height:1.6"><span style="position:absolute;left:0">•</span>'+tp+'</div>';});
  document.getElementById('rTraps').innerHTML = trapHtml;

  // 成长建议
  var growthHtml = '<div class="r-card-title" style="color:var(--success)">🌱 突破瓶颈的建议</div>';
  t.growth.forEach(function(g,i){growthHtml += '<div class="growth-item"><span class="growth-num">'+(i+1)+'</span><span class="growth-text">'+g+'</span></div>';});
  document.getElementById('rGrowth').innerHTML = growthHtml;

  // 高光场景
  if(t.scene){
    document.getElementById('rScene').innerHTML = '<div class="r-card-title">✨ 你的高光时刻</div><div style="font-size:14px;color:var(--text-d);line-height:1.8;font-style:italic">'+t.scene+'</div>';
  }

  // 搭档关系
  if(t.match){
    document.getElementById('rMatch').innerHTML = '<div class="r-card-title">🤝 型格关系指南</div><div style="font-size:13px;margin-bottom:8px"><span style="color:var(--success);font-weight:600">最佳搭档：</span>'+t.match.best+'</div><div style="font-size:13px"><span style="color:var(--danger);font-weight:600">容易冲突：</span>'+t.match.conflict+'</div>';
  }

  // 典型代表
  if(t.famous){
    document.getElementById('rFamous').innerHTML = '<div class="r-card-title">🌟 同型格代表人物</div><div style="font-size:14px;color:var(--text-d);line-height:1.6">'+t.famous+'</div>';
  }

  // 特质标签
  var traitsHtml = t.traits.map(function(tr){return '<span class="r-trait">'+tr+'</span>';}).join('');
  document.getElementById('rTraits').innerHTML = traitsHtml;

  // 触发动画
  setTimeout(function(){
    document.querySelectorAll('.score-bar-fill').forEach(function(el){
      var w = el.style.width;el.style.width = '0';
      setTimeout(function(){el.style.width = w;},50);
    });
  },100);
  } catch(e){
    console.error('showResult错误:', e.message, e.stack);
    document.getElementById('page-quiz').style.display='none';
    document.getElementById('page-result').style.display='flex';
    document.getElementById('rIcon').textContent='🔮';
    document.getElementById('rTitle').textContent='测试出错';
    document.getElementById('rDesc').innerHTML='<p>抱歉，结果加载失败:'+e.message+'</p><p>请刷新页面重试，或换个选择再测一次</p>';
  }
}

function resetQuiz(){
  document.getElementById('page-result').style.display='none';
  document.getElementById('page-cover').style.display='flex';
}

// === 分享图 ===
function showShare(){document.getElementById('shareModal').classList.add('show');drawShareCard();}
function closeShare(){document.getElementById('shareModal').classList.remove('show');}
function drawShareCard(){
  var canvas=document.getElementById('shareCanvas');
  var ctx=canvas.getContext('2d');
  var W=360,H=540;
  var grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#f5f3ff');grad.addColorStop(0.5,'#ede9fe');grad.addColorStop(1,'#ddd6fe');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(139,92,246,0.1)';ctx.lineWidth=1;
  for(var x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.fillStyle='#fff';ctx.strokeStyle='#7c3aed';ctx.lineWidth=1.5;ctx.font='12px sans-serif';
  var tw=ctx.measureText('天赋型格').width+24;roundRect(ctx,28,36,tw,26,5);ctx.fill();ctx.stroke();
  ctx.fillStyle='#7c3aed';ctx.font='bold 12px sans-serif';ctx.fillText('天赋型格',40,53);
  ctx.fillStyle='#7c3aed';ctx.font='12px sans-serif';ctx.fillText('NO.003',W-70,53);
  ctx.strokeStyle='#c4b5fd';ctx.beginPath();ctx.moveTo(110,49);ctx.lineTo(W-90,49);ctx.stroke();
  ctx.font='56px sans-serif';ctx.textAlign='center';
  ctx.fillText(document.getElementById('rIcon').textContent,W/2,160);
  ctx.fillStyle='#7c3aed';ctx.font='13px sans-serif';ctx.fillText('你的天赋型格是',W/2,200);
  ctx.fillStyle='#5b21b6';ctx.font='bold 30px sans-serif';
  ctx.fillText(document.getElementById('rTitle').textContent,W/2,240);
  ctx.fillStyle='#7c3aed';ctx.font='bold 12px sans-serif';
  var bw=ctx.measureText(document.getElementById('rBadge').textContent).width+24;
  roundRect(ctx,(W-bw)/2,260,bw,26,13);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillText(document.getElementById('rBadge').textContent,W/2,277);
  ctx.fillStyle='#5b21b6';ctx.font='13px sans-serif';
  var traits=document.getElementById('rTraits').innerText;
  ctx.fillText(traits.replace(/\n/g,' · '),W/2,320);
  ctx.fillStyle='rgba(91,33,182,0.6)';ctx.font='13px sans-serif';ctx.textAlign='left';
  var desc=document.getElementById('rDesc').textContent;
  var lines=desc.split('\n')[0].match(/.{1,18}/g)||[];
  lines.slice(0,4).forEach(function(line,i){ctx.fillText(line,40,370+i*22);});
  ctx.fillStyle='#fff';roundRect(ctx,W/2-40,440,80,80,12);ctx.fill();
  ctx.fillStyle='#7c3aed';ctx.font='11px sans-serif';ctx.textAlign='center';
  ctx.fillText('扫码来测',W/2,470);ctx.font='bold 22px sans-serif';ctx.fillText('🐾',W/2,500);
  ctx.fillStyle='rgba(91,33,182,0.3)';ctx.font='10px sans-serif';ctx.fillText('protest.xixizai.com',W/2,530);
  ctx.textAlign='left';
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function downloadShare(){var canvas=document.getElementById('shareCanvas');var link=document.createElement('a');link.download='我的天赋型格测试结果.png';link.href=canvas.toDataURL();link.click();}
