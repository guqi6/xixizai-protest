<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼豆图纸生成器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }

.header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px; text-align: center; }
.header h1 { font-size: 24px; margin-bottom: 4px; }
.header p { font-size: 13px; opacity: 0.9; }

.container { max-width: 1200px; margin: 0 auto; padding: 16px; }

/* 上传区 */
.upload-zone { 
  background: white; border: 2px dashed #ddd; border-radius: 12px; 
  padding: 40px 20px; text-align: center; cursor: pointer; 
  transition: all 0.3s; margin-bottom: 16px; 
}
.upload-zone:hover, .upload-zone.dragover { border-color: #667eea; background: #f8f9ff; }
.upload-zone .icon { font-size: 48px; margin-bottom: 8px; }
.upload-zone p { font-size: 16px; color: #666; margin-bottom: 4px; }
.upload-zone .hint { font-size: 12px; color: #999; }
#fileInput { display: none; }

/* 控制栏 */
.controls { 
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; 
  background: white; padding: 16px; border-radius: 12px; margin-bottom: 16px;
}
.control-group { display: flex; align-items: center; gap: 8px; }
.control-group label { font-size: 14px; font-weight: 600; white-space: nowrap; }
.control-group select, .control-group input[type="range"] { 
  padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
}
.control-group select { cursor: pointer; }

.btn { 
  padding: 10px 24px; border: none; border-radius: 8px; font-size: 15px; 
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-primary { background: #667eea; color: white; }
.btn-primary:hover { background: #5568d3; }
.btn-primary:disabled { background: #ccc; cursor: not-allowed; }
.btn-secondary { background: #f0f0f0; color: #333; }
.btn-secondary:hover { background: #e0e0e0; }

/* 预览区 */
.preview-container { 
  display: flex; gap: 16px; flex-wrap: wrap; 
}
.preview-box { 
  background: white; border-radius: 12px; padding: 16px; flex: 1; min-width: 300px;
}
.preview-box h3 { font-size: 14px; color: #666; margin-bottom: 12px; text-align: center; }
.preview-box canvas { max-width: 100%; display: block; margin: 0 auto; image-rendering: pixelated; }

/* 色板清单 */
.palette-section { 
  background: white; border-radius: 12px; padding: 16px; margin-top: 16px;
  display: none;
}
.palette-section h3 { font-size: 16px; margin-bottom: 12px; }
.palette-grid { 
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px;
}
.palette-item { 
  display: flex; align-items: center; gap: 8px; padding: 8px; 
  border: 1px solid #eee; border-radius: 8px; font-size: 13px;
}
.palette-swatch { 
  width: 24px; height: 24px; border-radius: 4px; border: 1px solid #ddd; flex-shrink: 0;
}
.palette-info { flex: 1; }
.palette-code { font-weight: 700; }
.palette-name { color: #666; font-size: 12px; }
.palette-count { font-weight: 600; color: #667eea; }

/* 统计信息 */
.stats { 
  display: flex; gap: 16px; margin-bottom: 12px; font-size: 14px;
}
.stat-item { 
  background: #f8f9ff; padding: 8px 16px; border-radius: 8px; 
}
.stat-value { font-weight: 700; color: #667eea; }

/* 响应式 */
@media (max-width: 768px) {
  .preview-container { flex-direction: column; }
  .controls { flex-direction: column; align-items: stretch; }
  .control-group { justify-content: space-between; }
}

/* Loading */
.loading { 
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
  background: rgba(255,255,255,0.8); display: none; 
  align-items: center; justify-content: center; z-index: 999;
}
.loading.show { display: flex; }
.loading-content { text-align: center; }
.spinner { 
  width: 40px; height: 40px; border: 4px solid #ddd; 
  border-top-color: #667eea; border-radius: 50%; 
  animation: spin 0.8s linear infinite; margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>🧩 拼豆图纸生成器</h1>
  <p>上传图片 → 生成Artkal标准色号图纸 → 下载打印照着拼</p>
</div>

<div class="container">
  <!-- 上传区 -->
  <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
    <div class="icon">📷</div>
    <p>点击或拖拽上传图片</p>
    <p class="hint">支持 JPG / PNG / WebP，建议小于 10MB</p>
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">
  </div>

  <!-- 控制栏 -->
  <div class="controls" id="controls" style="display:none;">
    <div class="control-group">
      <label>网格大小</label>
      <select id="gridSize">
        <option value="20">20×20 (小)</option>
        <option value="30">30×30</option>
        <option value="40" selected>40×40 (中)</option>
        <option value="50">50×50</option>
        <option value="60">60×60 (大)</option>
        <option value="80">80×80 (超大)</option>
      </select>
    </div>
    <div class="control-group">
      <label>颜色数量</label>
      <select id="colorLimit">
        <option value="0" selected>不限制</option>
        <option value="12">最多12色</option>
        <option value="24">最多24色</option>
        <option value="48">最多48色</option>
      </select>
    </div>
    <div class="control-group">
      <label><input type="checkbox" id="removeWhite"> 去白背景</label>
    </div>
    <button class="btn btn-primary" id="generateBtn" onclick="generate()">🎨 生成拼豆图</button>
    <button class="btn btn-secondary" id="downloadBtn" onclick="downloadPattern()" style="display:none;">📥 下载图纸</button>
  </div>

  <!-- 预览区 -->
  <div class="preview-container" id="previewContainer" style="display:none;">
    <div class="preview-box">
      <h3>原图</h3>
      <canvas id="originalCanvas"></canvas>
    </div>
    <div class="preview-box">
      <h3>拼豆预览</h3>
      <canvas id="beadCanvas"></canvas>
    </div>
  </div>

  <!-- 统计+色板 -->
  <div class="palette-section" id="paletteSection">
    <div class="stats" id="stats"></div>
    <h3>🎨 色板清单（照着买材料）</h3>
    <div class="palette-grid" id="paletteGrid"></div>
  </div>
</div>

<!-- Loading -->
<div class="loading" id="loading">
  <div class="loading-content">
    <div class="spinner"></div>
    <p>正在生成拼豆图...</p>
  </div>
</div>

// 预计算RGB
const PALETTE_RGB = ARTKAL_PALETTE.map(p => {
  const h = p.hex.replace('#','');
  return { ...p, r: parseInt(h.substr(0,2),16), g: parseInt(h.substr(2,2),16), b: parseInt(h.substr(4,2),16) };
});

// 全局
let currentImage = null;
let currentBeadData = null;

// 文件上传
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  if (!file.type.startsWith('image/')) { alert('请上传图片文件'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      currentImage = img;
      document.getElementById('controls').style.display = 'flex';
      // 显示原图预览
      const canvas = document.getElementById('originalCanvas');
      const maxW = 400;
      const scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      document.getElementById('previewContainer').style.display = 'flex';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 最近颜色匹配
function nearestBead(r, g, b, palette) {
  let best = palette[0], minD = Infinity;
  for (const p of palette) {
    const d = (r-p.r)*(r-p.r) + (g-p.g)*(g-p.g) + (b-p.b)*(b-p.b);
    if (d < minD) { minD = d; best = p; }
  }
  return best;
}

// 生成拼豆图
function generate() {
  if (!currentImage) return;
  
  document.getElementById('loading').classList.add('show');
  
  setTimeout(() => {
    const gridW = parseInt(document.getElementById('gridSize').value);
    const colorLimit = parseInt(document.getElementById('colorLimit').value);
    const removeWhite = document.getElementById('removeWhite').checked;
    
    const img = currentImage;
    const gridH = Math.max(1, Math.round(gridW * img.height / img.width));
    
    // 像素化
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = gridW;
    tempCanvas.height = gridH;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.imageSmoothingEnabled = true;
    tempCtx.drawImage(img, 0, 0, gridW, gridH);
    const pixels = tempCtx.getImageData(0, 0, gridW, gridH).data;
    
    // 第一步：全部匹配
    const beadMap = [];
    const colorCount = {};
    
    for (let i = 0; i < pixels.length; i += 4) {
      const r = pixels[i], g = pixels[i+1], b = pixels[i+2], a = pixels[i+3];
      
      // 去白背景
      if (removeWhite && r > 230 && g > 230 && b > 230) {
        beadMap.push(null);
        continue;
      }
      
      const bead = nearestBead(r, g, b, PALETTE_RGB);
      beadMap.push(bead);
      colorCount[bead.code] = (colorCount[bead.code] || 0) + 1;
    }
    
    // 颜色数量限制（可选）
    let usedPalette = PALETTE_RGB;
    if (colorLimit > 0 && Object.keys(colorCount).length > colorLimit) {
      // 按使用量排序，取前N个颜色
      const topColors = Object.entries(colorCount)
        .sort((a,b) => b[1]-a[1])
        .slice(0, colorLimit)
        .map(([code]) => code);
      usedPalette = PALETTE_RGB.filter(p => topColors.includes(p.code));
      
      // 重新匹配
      for (let i = 0; i < beadMap.length; i++) {
        if (beadMap[i] === null) continue;
        const r = pixels[i*4], g = pixels[i*4+1], b = pixels[i*4+2];
        beadMap[i] = nearestBead(r, g, b, usedPalette);
      }
      // 重新统计
      const newCount = {};
      for (const bead of beadMap) {
        if (!bead) continue;
        newCount[bead.code] = (newCount[bead.code] || 0) + 1;
      }
      Object.assign(colorCount, newCount);
    }
    
    // 渲染拼豆预览
    const CELL = 18;
    const beadCanvas = document.getElementById('beadCanvas');
    beadCanvas.width = gridW * CELL;
    beadCanvas.height = gridH * CELL;
    const ctx = beadCanvas.getContext('2d');
    
    // 白色背景
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, beadCanvas.width, beadCanvas.height);
    
    // 画方块
    for (let y = 0; y < gridH; y++) {
      for (let x = 0; x < gridW; x++) {
        const bead = beadMap[y * gridW + x];
        if (!bead) continue;
        
        ctx.fillStyle = bead.hex;
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        
        // 浅色网格线
        ctx.strokeStyle = '#e8e8e8';
        ctx.lineWidth = 1;
        ctx.strokeRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
    
    // 保存数据用于下载
    currentBeadData = { beadMap, gridW, gridH, colorCount, usedPalette: Object.values(colorCount) };
    
    // 显示色板清单
    renderPalette(colorCount, gridW * gridH);
    
    // 显示统计
    const totalBeads = beadMap.filter(b => b !== null).length;
    const usedColors = Object.keys(colorCount).length;
    document.getElementById('stats').innerHTML = `
      <div class="stat-item">📊 总格数: <span class="stat-value">${gridW}×${gridH}=${totalBeads}</span></div>
      <div class="stat-item">🎨 使用颜色: <span class="stat-value">${usedColors}</span>种</div>
      <div class="stat-item">📦 估计豆数: <span class="stat-value">${totalBeads}</span>颗</div>
    `;
    
    document.getElementById('paletteSection').style.display = 'block';
    document.getElementById('downloadBtn').style.display = 'inline-block';
    document.getElementById('loading').classList.remove('show');
  }, 100);
}

// 渲染色板清单
function renderPalette(colorCount, totalCells) {
  // 获取颜色详情
  const items = Object.entries(colorCount)
    .map(([code, count]) => {
      const p = PALETTE_RGB.find(x => x.code === code);
      return { ...p, count };
    })
    .sort((a, b) => b.count - a.count);
  
  const grid = document.getElementById('paletteGrid');
  grid.innerHTML = items.map(p => `
    <div class="palette-item">
      <div class="palette-swatch" style="background:${p.hex}"></div>
      <div class="palette-info">
        <span class="palette-code">${p.code}</span>
        <span class="palette-name">${p.name}</span>
      </div>
      <span class="palette-count">×${p.count}</span>
    </div>
  `).join('');
}

// 下载图纸（含网格+色板）
function downloadPattern() {
  if (!currentBeadData) return;
  
  const { beadMap, gridW, gridH, colorCount } = currentBeadData;
  const CELL = 20;
  const PAD = 20;
  
  // 计算色板区高度
  const items = Object.entries(colorCount)
    .map(([code, count]) => ({ ...PALETTE_RGB.find(x => x.code === code), count }))
    .sort((a,b) => b.count - a.count);
  
  const paletteCols = Math.ceil(items.length / 2);
  const paletteRowH = 28;
  const paletteH = Math.ceil(items.length / Math.max(1, Math.floor((gridW * CELL) / 180))) * paletteRowH + 50;
  
  const canvasW = gridW * CELL + PAD * 2;
  const canvasH = gridH * CELL + PAD * 2 + paletteH;
  
  const canvas = document.createElement('canvas');
  canvas.width = canvasW;
  canvas.height = canvasH;
  const ctx = canvas.getContext('2d');
  
  // 白色背景
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvasW, canvasH);
  
  // 网格
  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      const bead = beadMap[y * gridW + x];
      if (!bead) {
        // 透明（浅灰斜线）
        ctx.fillStyle = '#f8f8f8';
        ctx.fillRect(PAD + x*CELL, PAD + y*CELL, CELL, CELL);
        continue;
      }
      ctx.fillStyle = bead.hex;
      ctx.fillRect(PAD + x*CELL, PAD + y*CELL, CELL, CELL);
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;
      ctx.strokeRect(PAD + x*CELL, PAD + y*CELL, CELL, CELL);
    }
  }
  
  // 分隔线
  const sepY = PAD + gridH * CELL + 10;
  ctx.strokeStyle = '#cccccc';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(PAD, sepY);
  ctx.lineTo(canvasW - PAD, sepY);
  ctx.stroke();
  
  // 色板标题
  ctx.fillStyle = '#333333';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('🎨 色板清单（照着买材料）', PAD, sepY + 22);
  
  // 色板列表
  const colW = 200;
  const cols = Math.max(1, Math.floor((canvasW - PAD * 2) / colW));
  ctx.font = '12px sans-serif';
  
  items.forEach((p, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const px = PAD + col * colW;
    const py = sepY + 38 + row * paletteRowH;
    
    // 色块
    ctx.fillStyle = p.hex;
    ctx.fillRect(px, py, 22, 22);
    ctx.strokeStyle = '#999999';
    ctx.lineWidth = 1;
    ctx.strokeRect(px, py, 22, 22);
    
    // 文字
    ctx.fillStyle = '#333333';
    ctx.fillText(`${p.code} ${p.name}`, px + 28, py + 10);
    ctx.fillStyle = '#667eea';
    ctx.fillText(`×${p.count}`, px + 28, py + 22);
  });
  
  // 下载
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `bead_pattern_${gridW}x${gridH}.png`;
    a.click();
    URL.revokeObjectURL(url);
  });
}
