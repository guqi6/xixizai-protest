<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>拼豆图纸生成器</title>
  <style>
    :root{--ink:#282522;--muted:#716d68;--paper:#fff;--bg:#f6f2ec;--accent:#d74f6a;--accent2:#734c9e;--line:#e6ded5;--soft:#fff8f2}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(145deg,#fbf8f3 0,#f3edf5 100%);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;min-height:100vh}
    button,input,select{font:inherit}
    .hero{padding:34px 20px 28px;text-align:center;background:radial-gradient(circle at 20% 20%,rgba(255,219,153,.72),transparent 32%),radial-gradient(circle at 80% 10%,rgba(218,197,242,.74),transparent 30%),#fff}
    .hero h1{font-size:clamp(26px,4vw,42px);margin:0 0 8px;letter-spacing:.04em}
    .hero p{margin:0;color:var(--muted);font-size:15px}
    .shell{width:min(1240px,calc(100% - 28px));margin:24px auto 56px}
    .card{background:rgba(255,255,255,.95);border:1px solid rgba(113,109,104,.13);border-radius:18px;box-shadow:0 10px 35px rgba(74,54,43,.08);padding:20px;margin-bottom:18px}
    .upload{border:2px dashed #d8c8bc;text-align:center;padding:25px 16px;cursor:pointer;transition:.2s;background:linear-gradient(180deg,#fff,#fffaf5)}
    .upload:hover,.upload.drag{border-color:var(--accent);transform:translateY(-1px)}
    .upload-icon{font-size:34px}.upload strong{display:block;font-size:18px;margin:5px 0}.upload small{color:var(--muted)}
    .upload-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
    .btn{border:0;border-radius:11px;padding:10px 18px;cursor:pointer;font-weight:700;transition:.18s}
    .btn:disabled{opacity:.48;cursor:not-allowed}.btn-primary{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 16px rgba(115,76,158,.22)}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px)}.btn-ghost{background:#f2ede8;color:#443e39}.btn-ghost:hover{background:#e9e1da}
    .controls{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:14px;align-items:end}
    .field label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}.field input[type=number],.field input[type=range],.field select{width:100%;border:1px solid #dcd3cb;border-radius:9px;background:#fff;padding:9px 10px;color:var(--ink)}
    .field .range-row{display:grid;grid-template-columns:1fr 58px;gap:8px;align-items:center}.field input[type=range]{padding:0;border:0}
    details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;font-weight:700;color:#554d47}.advanced{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:16px;margin-top:14px}
    .check{display:flex;gap:8px;align-items:flex-start;font-size:14px}.check input{margin-top:3px}.help{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:5px}
    .actions{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
    .preprocess{margin-top:16px;padding:14px;border:1px solid #eadfd6;border-radius:12px;background:#fffaf6;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
    .preprocess-copy{min-width:220px;flex:1}.preprocess-copy strong{display:block;margin-bottom:4px}.preprocess-copy span{color:var(--muted);font-size:12px;line-height:1.5}
    .preprocess-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.preprocess-actions select{border:1px solid #dcd3cb;border-radius:9px;background:#fff;padding:8px 9px}
    .status{min-height:24px;margin-top:12px;text-align:center;color:var(--muted);font-size:13px}.status.error{color:#b4233d}
    .preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.preview-head h2,.palette-title{font-size:18px;margin:0}.legend{font-size:12px;color:var(--muted)}
    .compare{display:grid;grid-template-columns:minmax(220px,.38fr) minmax(0,1fr);gap:18px;align-items:start}
    .pane{background:#faf8f5;border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0}.pane h3{font-size:13px;color:var(--muted);margin:0 0 10px;text-align:center}
    .canvas-scroll{overflow:auto;max-height:78vh;text-align:center;background:#fff;border-radius:8px;border:1px solid #eee8e2;padding:6px}
    canvas{display:block;max-width:100%;height:auto;margin:auto}.original-wrap canvas{max-height:62vh;object-fit:contain;background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0}
    .stats{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 14px}.stat{padding:10px 14px;border-radius:10px;background:#faf3eb;border:1px solid #f0e2d3;font-size:14px}.stat b{font-size:16px;color:var(--accent2)}
    .palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .palette-item{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;padding:8px;background:#fff;min-width:0}.swatch{width:34px;height:34px;flex:0 0 34px;border-radius:8px;border:1px solid rgba(0,0,0,.13)}.p-text{min-width:0;flex:1}.p-code{font-weight:800}.p-name{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.p-count{font-weight:800;color:var(--accent2)}
    .empty{display:none}.notice{background:#fff9e8;border:1px solid #f0dfb8;border-radius:11px;padding:10px 13px;font-size:12px;color:#6f5d37;margin-top:12px}
    @media(max-width:820px){.controls,.advanced{grid-template-columns:repeat(2,1fr)}.compare{grid-template-columns:1fr}.shell{width:min(100% - 18px,1240px)}.card{padding:14px}}
    @media(max-width:480px){.controls,.advanced{grid-template-columns:1fr}.hero{padding:25px 16px}.btn{width:100%}}
  </style>
</head>
<body>
  <header class="hero">
    <h1>拼豆图纸生成器</h1>
    <p>上传图片，自动匹配专用色卡，生成可以直接照着拼的坐标图纸</p>
  </header>

  <main class="shell">
    <section class="card upload" id="uploadZone" aria-label="上传图片区域">
      <div class="upload-icon">🧩</div>
      <strong>点击或拖拽图片到这里</strong>
      <small>支持 JPG、PNG、WebP，图片仅在你的浏览器中处理</small>
      <div class="upload-actions">
        <button class="btn btn-primary" type="button" id="chooseBtn">选择图片</button>
        <button class="btn btn-ghost" type="button" id="sampleBtn">先用示例体验</button>
      </div>
      <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    </section>

    <section class="card empty" id="controlCard">
      <div class="controls">
        <div class="field">
          <label for="gridWidth">横向格数</label>
          <div class="range-row"><input id="gridWidthRange" type="range" min="20" max="100" value="50"><input id="gridWidth" type="number" min="20" max="100" value="50"></div>
        </div>
        <div class="field"><label for="renderMode">生成模式</label><select id="renderMode"><option value="crisp" selected>清晰拼豆（推荐）</option><option value="faithful">忠实原图</option></select></div>
        <div class="field"><label for="colorLimit">颜色数量</label><select id="colorLimit"><option value="auto" selected>自动</option><option value="6">6 色</option><option value="8">8 色</option><option value="12">12 色</option><option value="24">24 色</option><option value="48">48 色</option><option value="0">不限制</option></select></div>
        <button class="btn btn-primary" type="button" id="generateBtn">生成拼豆图纸</button>
      </div>

      <div class="preprocess">
        <div class="preprocess-copy"><strong>可选：生成前一键抠图</strong><span>抠图与拼豆生成完全分开。不抠图也可以直接生成，生成过程不会再自动删除散点或浅色主体。</span></div>
        <div class="preprocess-actions">
          <select id="cutoutThreshold" aria-label="抠图强度"><option value="7">非常保守</option><option value="11" selected>保守</option><option value="16">标准</option><option value="22">较强</option></select>
          <button class="btn btn-ghost" type="button" id="cutoutBtn">一键抠图</button>
          <button class="btn btn-ghost" type="button" id="restoreBtn" disabled>恢复原图</button>
          <button class="btn btn-ghost" type="button" id="downloadCutoutBtn" disabled>下载抠图 PNG</button>
        </div>
      </div>

      <details>
        <summary>清晰模式与图纸设置</summary>
        <div class="advanced">
          <label class="check"><input id="forceH7" type="checkbox" checked><span>黑灰描边统一使用 H7<span class="help">识别眼睛、嘴、头发等细线；不会把普通灰色填充区域全部变黑。</span></span></label>
          <div class="field"><label for="simplifyLevel">色块统一程度</label><select id="simplifyLevel"><option value="light">轻微</option><option value="standard" selected>标准</option><option value="strong">强力</option></select><span class="help">越强，皮肤和头发使用的近似颜色越少。</span></div>
          <label class="check"><input id="minorGrid" type="checkbox" checked><span>显示每格浅虚线<span class="help">可关闭；每 5 格实线、外框和坐标始终保留。</span></span></label>
        </div>
      </details>
      <div class="actions"><button class="btn btn-ghost" type="button" id="downloadBtn" disabled>下载高清 PNG 图纸</button></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>

    <section class="card empty" id="previewCard">
      <div class="preview-head"><h2>图纸预览</h2><span class="legend">每 5 格为实线，每 10 格加粗</span></div>
      <div class="compare">
        <div class="pane original-wrap"><h3>原图</h3><canvas id="originalCanvas"></canvas></div>
        <div class="pane"><h3>拼豆坐标图</h3><div class="canvas-scroll"><canvas id="patternCanvas"></canvas></div></div>
      </div>
      <div class="stats" id="stats"></div>
      <h2 class="palette-title">用色与数量</h2>
      <div class="palette" id="paletteList"></div>
      <div class="notice">屏幕预览会自动缩放。下载的 PNG 是高清原尺寸，格内色号和坐标会更清楚。</div>
    </section>
  </main>

  <script src="palette.js"></script>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const palette = (window.BEAD_PALETTE || []).map(p => {
      const rgb = hexToRgb(p.hex);
      return {...p,...rgb,lab:rgbToLab(rgb.r,rgb.g,rgb.b)};
    });
    let originalImage = null;
    let currentImage = null;
    let currentData = null;
    let cutoutBlob = null;
    let cutoutUrl = null;
    let sourceName = '图片';

    const uploadZone=$('uploadZone'), fileInput=$('fileInput'), chooseBtn=$('chooseBtn'), sampleBtn=$('sampleBtn');
    chooseBtn.addEventListener('click', e => {e.stopPropagation();fileInput.click();});
    sampleBtn.addEventListener('click', e => {e.stopPropagation();loadSample();});
    uploadZone.addEventListener('click', e => {if(!e.target.closest('button')) fileInput.click();});
    uploadZone.addEventListener('dragover', e => {e.preventDefault();uploadZone.classList.add('drag');});
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
    uploadZone.addEventListener('drop', e => {e.preventDefault();uploadZone.classList.remove('drag');if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);});
    fileInput.addEventListener('change', () => {if(fileInput.files[0]) loadFile(fileInput.files[0]);});
    $('generateBtn').addEventListener('click', generate);
    $('downloadBtn').addEventListener('click', downloadPattern);
    $('cutoutBtn').addEventListener('click', performCutout);
    $('restoreBtn').addEventListener('click', restoreOriginal);
    $('downloadCutoutBtn').addEventListener('click', downloadCutout);
    $('minorGrid').addEventListener('change', () => {if(currentData) renderPattern($('patternCanvas'),currentData,22,$('minorGrid').checked);});
    $('gridWidthRange').addEventListener('input', () => $('gridWidth').value=$('gridWidthRange').value);
    $('gridWidth').addEventListener('input', () => $('gridWidthRange').value=clamp(Number($('gridWidth').value)||50,20,100));

    function hexToRgb(hex){const h=hex.replace('#','');return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
    function rgbToLab(r,g,b){
      let R=r/255,G=g/255,B=b/255;
      R=R>.04045?Math.pow((R+.055)/1.055,2.4):R/12.92;G=G>.04045?Math.pow((G+.055)/1.055,2.4):G/12.92;B=B>.04045?Math.pow((B+.055)/1.055,2.4):B/12.92;
      let x=(R*.4124+G*.3576+B*.1805)/.95047,y=(R*.2126+G*.7152+B*.0722),z=(R*.0193+G*.1192+B*.9505)/1.08883;
      const f=v=>v>.008856?Math.cbrt(v):(7.787*v+16/116);x=f(x);y=f(y);z=f(z);
      return {l:116*y-16,a:500*(x-y),b:200*(y-z)};
    }
    function labDistance(a,b){const dl=a.l-b.l,da=a.a-b.a,db=a.b-b.b;return Math.sqrt(dl*dl+da*da+db*db);}
    function nearestBead(lab,allowed=palette){let best=allowed[0],d=Infinity;for(const p of allowed){const n=labDistance(lab,p.lab);if(n<d){d=n;best=p;}}return best;}
    function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

    function loadFile(file){
      if(!file.type.startsWith('image/')) return setStatus('请选择 JPG、PNG 或 WebP 图片。',true);
      if(file.size>15*1024*1024) return setStatus('图片超过 15MB，请先压缩后再试。',true);
      const reader=new FileReader();
      reader.onload=()=>loadImageUrl(reader.result,file.name);
      reader.onerror=()=>setStatus('图片读取失败，请换一张图片重试。',true);
      reader.readAsDataURL(file);
    }

    function loadImageUrl(url,name='示例图'){
      const img=new Image();
      img.onload=()=>{
        if(cutoutUrl)URL.revokeObjectURL(cutoutUrl);
        originalImage=img;currentImage=img;cutoutBlob=null;cutoutUrl=null;sourceName=name;
        $('restoreBtn').disabled=true;$('downloadCutoutBtn').disabled=true;
        drawSourcePreview();
        $('controlCard').classList.remove('empty');$('previewCard').classList.remove('empty');
        setStatus(`已读取“${name}”，正在生成…`);generate();
      };
      img.onerror=()=>setStatus('图片无法打开，请换一张图片。',true);
      img.src=url;
    }

    function drawSourcePreview(){
      if(!currentImage)return;const c=$('originalCanvas'),ctx=c.getContext('2d');
      const scale=Math.min(1,520/currentImage.width,520/currentImage.height);c.width=Math.max(1,Math.round(currentImage.width*scale));c.height=Math.max(1,Math.round(currentImage.height*scale));
      ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(currentImage,0,0,c.width,c.height);
    }

    function loadSample(){
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620"><rect width="720" height="620" fill="#fffaf2"/><circle cx="360" cy="312" r="224" fill="#f6bde8"/><path fill="#1b1213" d="M214 250c-42-95 14-156 74-73 34-35 110-34 145 1 61-84 118-18 73 78 37 91-18 203-144 208-129 5-188-113-148-214z"/><path fill="#fff" d="M272 286c41-46 79 3 56 39-28 39-78 4-56-39zm126 3c38-50 83-3 57 38-26 38-80 2-57-38z"/><circle cx="303" cy="310" r="14" fill="#3977ca"/><circle cx="425" cy="310" r="14" fill="#3977ca"/><path fill="#f75842" d="M348 347c10-10 21-10 31 0-4 14-25 15-31 0z"/><path fill="#c8e87d" d="M310 410c39 25 76 25 112 0-18 53-89 56-112 0z"/><circle cx="111" cy="112" r="8" fill="#d13b95"/><circle cx="648" cy="500" r="7" fill="#d13b95"/></svg>`;
      loadImageUrl('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),'内置示例图');
    }

    function setStatus(message,isError=false){const el=$('status');el.textContent=message;el.classList.toggle('error',isError);}

    async function performCutout(){
      if(!originalImage){setStatus('请先选择图片。',true);return;}
      const button=$('cutoutBtn');button.disabled=true;$('generateBtn').disabled=true;
      setStatus('正在保守识别图片边缘背景…');
      await new Promise(resolve=>setTimeout(resolve,30));
      try{
        const maxSide=3200,scale=Math.min(1,maxSide/Math.max(originalImage.width,originalImage.height));
        const w=Math.max(1,Math.round(originalImage.width*scale)),h=Math.max(1,Math.round(originalImage.height*scale));
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(originalImage,0,0,w,h);const imageData=ctx.getImageData(0,0,w,h),d=imageData.data;
        const bg=estimateEdgeBackground(d,w,h),tolerance=Number($('cutoutThreshold').value),limit=tolerance*2.25;
        const removed=new Uint8Array(w*h),seen=new Uint8Array(w*h),queue=new Int32Array(w*h);let head=0,tail=0;
        const distanceToBg=i=>{const k=i*4,dr=d[k]-bg.r,dg=d[k+1]-bg.g,db=d[k+2]-bg.b;return Math.sqrt(dr*dr*.30+dg*dg*.59+db*db*.11);};
        const localDistance=(a,b)=>{const ka=a*4,kb=b*4,dr=d[ka]-d[kb],dg=d[ka+1]-d[kb+1],db=d[ka+2]-d[kb+2];return Math.sqrt(dr*dr*.30+dg*dg*.59+db*db*.11);};
        const tryAdd=(i,parent=-1)=>{if(seen[i])return;seen[i]=1;const k=i*4;if(d[k+3]<40||(distanceToBg(i)<=limit&&(parent<0||localDistance(i,parent)<=Math.max(8,tolerance*1.15)))){removed[i]=1;queue[tail++]=i;}};
        for(let x=0;x<w;x++){tryAdd(x);tryAdd((h-1)*w+x);}for(let y=1;y<h-1;y++){tryAdd(y*w);tryAdd(y*w+w-1);}
        while(head<tail){const i=queue[head++],x=i%w,y=Math.floor(i/w);if(x>0)tryAdd(i-1,i);if(x<w-1)tryAdd(i+1,i);if(y>0)tryAdd(i-w,i);if(y<h-1)tryAdd(i+w,i);}
        const ratio=tail/(w*h);
        if(ratio>.92)throw new Error('范围过大');
        for(let i=0;i<removed.length;i++)if(removed[i])d[i*4+3]=0;
        ctx.putImageData(imageData,0,0);
        const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
        if(!blob)throw new Error('无法生成透明图片');
        if(cutoutUrl)URL.revokeObjectURL(cutoutUrl);cutoutBlob=blob;cutoutUrl=URL.createObjectURL(blob);
        const cutoutImage=new Image();await new Promise((resolve,reject)=>{cutoutImage.onload=resolve;cutoutImage.onerror=reject;cutoutImage.src=cutoutUrl;});
        currentImage=cutoutImage;drawSourcePreview();$('restoreBtn').disabled=false;$('downloadCutoutBtn').disabled=false;
        setStatus(`抠图完成，已移除约 ${Math.round(ratio*100)}% 的边缘背景；可以下载透明 PNG 或继续生成图纸。`);
        generate();
      }catch(err){console.error(err);setStatus('本次抠图可能会误删过多内容，已经自动取消。请选择“非常保守”后重试，或直接使用原图生成。',true);}
      finally{button.disabled=false;$('generateBtn').disabled=false;}
    }

    function estimateEdgeBackground(data,w,h){
      const values=[],block=Math.max(1,Math.min(24,Math.round(Math.min(w,h)*.035),w,h));
      const addBlock=(sx,sy)=>{for(let y=sy;y<sy+block;y+=2)for(let x=sx;x<sx+block;x+=2){const k=(y*w+x)*4;if(data[k+3]>80)values.push([data[k],data[k+1],data[k+2]]);}};
      addBlock(0,0);addBlock(w-block,0);addBlock(0,h-block);addBlock(w-block,h-block);
      if(!values.length)return {r:255,g:255,b:255};
      const median=n=>{const a=values.map(v=>v[n]).sort((x,y)=>x-y);return a[Math.floor(a.length/2)];};
      return {r:median(0),g:median(1),b:median(2)};
    }

    function restoreOriginal(){
      if(!originalImage)return;currentImage=originalImage;cutoutBlob=null;if(cutoutUrl){URL.revokeObjectURL(cutoutUrl);cutoutUrl=null;}
      $('restoreBtn').disabled=true;$('downloadCutoutBtn').disabled=true;drawSourcePreview();setStatus('已恢复原图；生成阶段不会自动抠图或删除细节。');generate();
    }

    function downloadCutout(){
      if(!cutoutBlob)return;const url=URL.createObjectURL(cutoutBlob),a=document.createElement('a');a.href=url;a.download=`${sourceName.replace(/\.[^.]+$/,'')}_抠图.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);setStatus('透明背景 PNG 已下载。');
    }

    function generate(){
      if(!currentImage){setStatus('请先选择图片。',true);return;}
      if(palette.length<200){setStatus('色卡加载失败，请确认 palette.js 与页面在同一文件夹。',true);return;}
      const gridW=clamp(parseInt($('gridWidth').value,10)||50,20,100);
      $('gridWidth').value=gridW;$('gridWidthRange').value=gridW;
      const gridH=clamp(Math.round(gridW*currentImage.height/currentImage.width),1,140);
      const mode=$('renderMode').value,limitValue=$('colorLimit').value,simplify=$('simplifyLevel').value;
      setStatus(mode==='crisp'?'正在识别描边并统一连续色块…':'正在按色卡忠实转换图片…');$('generateBtn').disabled=true;$('downloadBtn').disabled=true;
      requestAnimationFrame(()=>setTimeout(()=>{
        try{
          let map;
          if(mode==='crisp'){
            const cells=analyzeImageCells(currentImage,gridW,gridH,6);
            map=buildCrispMap(cells,gridW,gridH,{limitValue,simplify,forceH7:$('forceH7').checked});
          }else{
            const raw=sampleImage(currentImage,gridW,gridH);
            map=raw.map(px=>px.a<96?null:nearestBead(px.lab));
            const limit=limitValue==='auto'?0:Number(limitValue);
            if(limit>0)map=limitColors(map,raw,limit);
          }
          const counts=countColors(map),total=map.reduce((n,p)=>n+(p?1:0),0);
          currentData={map,gridW,gridH,counts,total,mode};
          renderPattern($('patternCanvas'),currentData,22,$('minorGrid').checked);
          renderSummary(currentData);
          $('downloadBtn').disabled=total===0;
          const modeText=mode==='crisp'?'清晰拼豆模式':'忠实原图模式';
          setStatus(total?`完成：${modeText}，${gridW}×${gridH}，${Object.keys(counts).length} 色，共 ${total} 颗。未删除任何格子。`:'当前图片全部为透明区域。',total===0);
        }catch(err){console.error(err);setStatus('生成失败，请换一张图片或减小格数后重试。',true);}
        finally{$('generateBtn').disabled=false;}
      },30));
    }

    function analyzeImageCells(img,w,h,supersample=6){
      const sw=w*supersample,sh=h*supersample,c=document.createElement('canvas');c.width=sw;c.height=sh;
      const ctx=c.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.clearRect(0,0,sw,sh);ctx.drawImage(img,0,0,sw,sh);
      const data=ctx.getImageData(0,0,sw,sh).data,cells=new Array(w*h),area=supersample*supersample;
      const pct=(arr,q)=>arr[Math.min(arr.length-1,Math.max(0,Math.floor((arr.length-1)*q)))];
      for(let gy=0;gy<h;gy++)for(let gx=0;gx<w;gx++){
        const rs=[],gs=[],bs=[],lums=[];
        for(let py=0;py<supersample;py++)for(let px=0;px<supersample;px++){
          const k=(((gy*supersample+py)*sw)+(gx*supersample+px))*4,a=data[k+3];if(a<72)continue;
          const r=data[k],g=data[k+1],b=data[k+2];rs.push(r);gs.push(g);bs.push(b);lums.push(r*.299+g*.587+b*.114);
        }
        const i=gy*w+gx,coverage=rs.length/area;
        if(coverage<.34){cells[i]={a:0,coverage,outlineCandidate:false,confidence:0,blackRatio:0};continue;}
        rs.sort((a,b)=>a-b);gs.sort((a,b)=>a-b);bs.sort((a,b)=>a-b);lums.sort((a,b)=>a-b);
        const r=pct(rs,.5),g=pct(gs,.5),b=pct(bs,.5),medianLum=pct(lums,.5),low=pct(lums,.10),high=pct(lums,.90),contrast=high-low;
        const darkCut=Math.min(96,medianLum-28),darkRatio=lums.filter(v=>v<darkCut).length/lums.length,blackRatio=lums.filter(v=>v<48).length/lums.length;
        const confidence=Math.min(2,(blackRatio*2.2+darkRatio*1.35)*(contrast/52));
        const outlineCandidate=(blackRatio>=.065&&contrast>=30)||(darkRatio>=.14&&contrast>=43);
        const weakCandidate=(blackRatio>=.025&&contrast>=20)||(darkRatio>=.075&&contrast>=30);
        cells[i]={r,g,b,a:Math.round(coverage*255),coverage,lab:rgbToLab(r,g,b),medianLum,contrast,darkRatio,blackRatio,confidence,outlineCandidate,weakCandidate};
      }
      return cells;
    }

    function bridgeDirectionalGaps(mask,cells,w,h){
      const endpoints=[];
      for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
        const i=y*w+x;if(!mask[i])continue;const neighbors=[];
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;if(mask[(y+dy)*w+x+dx])neighbors.push({x:x+dx,y:y+dy});}
        if(neighbors.length===1){const n=neighbors[0],tx=x-n.x,ty=y-n.y,len=Math.hypot(tx,ty)||1;endpoints.push({i,x,y,tx:tx/len,ty:ty/len});}
      }
      const out=mask.slice(),used=new Set();
      for(let a=0;a<endpoints.length;a++){
        let chosen=null,best=Infinity;const p=endpoints[a];if(used.has(p.i))continue;
        for(let b=a+1;b<endpoints.length;b++){
          const q=endpoints[b];if(used.has(q.i))continue;const dx=q.x-p.x,dy=q.y-p.y,dist=Math.hypot(dx,dy);if(dist<1.5||dist>3.25)continue;
          const ux=dx/dist,uy=dy/dist,alignA=p.tx*ux+p.ty*uy,alignB=q.tx*(-ux)+q.ty*(-uy);if(alignA<.18||alignB<.18)continue;
          const steps=Math.ceil(dist*2),between=[];let evidence=0;
          for(let s=1;s<steps;s++){const x=Math.round(p.x+dx*s/steps),y=Math.round(p.y+dy*s/steps),i=y*w+x;if(i===p.i||i===q.i||between.includes(i))continue;between.push(i);const c=cells[i];if(c&&c.a&&(c.weakCandidate||c.contrast>15||c.blackRatio>.008))evidence++;}
          if(between.length&&evidence/between.length>=.6&&dist<best){best=dist;chosen={q,between};}
        }
        if(chosen){for(const i of chosen.between)out[i]=1;used.add(p.i);used.add(chosen.q.i);}
      }
      return out;
    }

    function thinWeakBlocks(mask,strong,cells,w,h){
      const out=mask.slice();
      for(let y=0;y<h-1;y++)for(let x=0;x<w-1;x++){
        const ids=[y*w+x,y*w+x+1,(y+1)*w+x,(y+1)*w+x+1],filled=ids.filter(i=>out[i]);if(filled.length<4)continue;
        const removable=filled.filter(i=>!strong[i]).sort((a,b)=>(cells[a].confidence||0)-(cells[b].confidence||0));if(removable.length)out[removable[0]]=0;
      }
      return out;
    }

    function refineOutline(cells,w,h,enabled){
      const strong=new Uint8Array(cells.length);if(!enabled)return strong;
      for(let i=0;i<cells.length;i++)if(cells[i].a&&cells[i].outlineCandidate)strong[i]=1;
      const mask=strong.slice(),depth=new Uint8Array(cells.length),queue=[];for(let i=0;i<strong.length;i++)if(strong[i])queue.push(i);
      for(let q=0;q<queue.length;q++){
        const i=queue[q],x=i%w,y=Math.floor(i/w);if(depth[i]>=5)continue;
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
          if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(nx<0||nx>=w||ny<0||ny>=h)continue;const ni=ny*w+nx,c=cells[ni];
          if(!mask[ni]&&c&&c.a&&c.weakCandidate){let around=0;for(let ay=-1;ay<=1;ay++)for(let ax=-1;ax<=1;ax++){if(!ax&&!ay)continue;const px=nx+ax,py=ny+ay;if(px>=0&&px<w&&py>=0&&py<h&&mask[py*w+px])around++;}if(around<=3){mask[ni]=1;depth[ni]=depth[i]+1;queue.push(ni);}}
        }
      }
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){
        const i=y*w+x;if(!mask[i]||strong[i])continue;let neighbors=0;
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(nx>=0&&nx<w&&ny>=0&&ny<h&&mask[ny*w+nx])neighbors++;}
        if(neighbors===0)mask[i]=0;
      }
      let bridged=mask.slice();
      for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
        const i=y*w+x;if(bridged[i]||!cells[i].a)continue;
        const opposite=(bridged[i-1]&&bridged[i+1])||(bridged[i-w]&&bridged[i+w])||(bridged[i-w-1]&&bridged[i+w+1])||(bridged[i-w+1]&&bridged[i+w-1]);
        if(opposite&&(cells[i].weakCandidate||cells[i].confidence>.06))bridged[i]=1;
      }
      bridged=bridgeDirectionalGaps(bridged,cells,w,h);
      return thinWeakBlocks(bridged,strong,cells,w,h);
    }

    function clusterCellColors(cells,indices,k){
      if(!indices.length)return {assignments:new Int16Array(cells.length).fill(-1),colors:[]};
      const bins=new Map();
      for(const i of indices){const c=cells[i],key=`${c.r>>4},${c.g>>4},${c.b>>4}`;let bin=bins.get(key);if(!bin){bin={count:0,l:0,a:0,b:0};bins.set(key,bin);}bin.count++;bin.l+=c.lab.l;bin.a+=c.lab.a;bin.b+=c.lab.b;}
      const seeds=[...bins.values()].map(b=>({count:b.count,l:b.l/b.count,a:b.a/b.count,b:b.b/b.count})).sort((a,b)=>b.count-a.count);
      k=Math.max(1,Math.min(k,seeds.length,indices.length));const centers=[{l:seeds[0].l,a:seeds[0].a,b:seeds[0].b}];
      while(centers.length<k){let best=null,bestScore=-1;for(const s of seeds){let min=Infinity;for(const c of centers){const dl=s.l-c.l,da=s.a-c.a,db=s.b-c.b;min=Math.min(min,dl*dl+da*da+db*db);}const score=min*Math.log2(s.count+1);if(score>bestScore){bestScore=score;best=s;}}if(!best||bestScore<.01)break;centers.push({l:best.l,a:best.a,b:best.b});}
      const assignments=new Int16Array(cells.length);assignments.fill(-1);
      for(let iter=0;iter<12;iter++){
        const sums=centers.map(()=>({l:0,a:0,b:0,n:0}));
        for(const i of indices){const p=cells[i].lab;let best=0,min=Infinity;for(let n=0;n<centers.length;n++){const c=centers[n],dl=p.l-c.l,da=p.a-c.a,db=p.b-c.b,d=dl*dl+da*da+db*db;if(d<min){min=d;best=n;}}assignments[i]=best;const s=sums[best];s.l+=p.l;s.a+=p.a;s.b+=p.b;s.n++;}
        for(let n=0;n<centers.length;n++)if(sums[n].n){centers[n]={l:sums[n].l/sums[n].n,a:sums[n].a/sums[n].n,b:sums[n].b/sums[n].n};}
      }
      return {assignments,colors:centers.map(c=>nearestBead(c))};
    }

    function smoothRegionColors(map,outline,w,h,passes,level){
      let current=map.slice();
      for(let pass=0;pass<passes;pass++){
        const next=current.slice(),needed=level==='strong'?4:5;
        for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
          const i=y*w+x;if(!current[i]||outline[i])continue;const freq={};
          for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const ni=(y+dy)*w+x+dx;if(current[ni]&&!outline[ni])freq[current[ni].code]=(freq[current[ni].code]||0)+1;}
          const best=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];if(best&&best[1]>=needed&&best[0]!==current[i].code)next[i]=palette.find(p=>p.code===best[0]);
        }
        current=next;
      }
      return current;
    }

    function completeLightContours(map,cells,outline,w,h,h7){
      const result=map.slice(),seen=new Uint8Array(map.length),isLight=p=>p&&(p.code==='H1'||p.code==='H2');
      for(let start=0;start<map.length;start++){
        if(seen[start]||!isLight(result[start]))continue;const component=[],queue=[start];seen[start]=1;
        for(let q=0;q<queue.length;q++){
          const i=queue[q];component.push(i);const x=i%w,y=Math.floor(i/w);
          for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||nx>=w||ny<0||ny>=h)continue;const ni=ny*w+nx;if(!seen[ni]&&isLight(result[ni])){seen[ni]=1;queue.push(ni);}}
        }
        if(component.length<6||component.length>map.length*.22)continue;
        const boundarySet=new Set();for(const i of component){const x=i%w,y=Math.floor(i/w);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(nx<0||nx>=w||ny<0||ny>=h)continue;const ni=ny*w+nx;if(!isLight(result[ni])&&result[ni])boundarySet.add(ni);}}
        const boundary=[...boundarySet],existing=boundary.filter(i=>result[i].code==='H7').length;if(existing<4||existing/boundary.length<.24)continue;
        for(let pass=0;pass<2;pass++)for(const i of boundary){if(result[i].code==='H7')continue;const x=i%w,y=Math.floor(i/w);let nearH7=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(nx>=0&&nx<w&&ny>=0&&ny<h&&result[ny*w+nx]&&result[ny*w+nx].code==='H7')nearH7++;}const c=cells[i],evidence=c&&(c.weakCandidate||c.contrast>23||c.blackRatio>.012);if(nearH7>=2&&evidence){result[i]=h7;outline[i]=1;}}
      }
      return result;
    }

    function buildCrispMap(cells,w,h,{limitValue='auto',simplify='standard',forceH7=true}={}){
      const outline=refineOutline(cells,w,h,forceH7),h7=palette.find(p=>p.code==='H7'),fillIndices=[];
      for(let i=0;i<cells.length;i++)if(cells[i].a&&!outline[i])fillIndices.push(i);
      const automatic={light:12,standard:8,strong:6},requested=limitValue==='auto'?automatic[simplify]:(Number(limitValue)||48),hasOutline=outline.some(v=>v===1),fillK=Math.max(1,requested-(hasOutline?1:0));
      const clustered=clusterCellColors(cells,fillIndices,fillK),map=new Array(cells.length).fill(null);
      for(let i=0;i<cells.length;i++){if(!cells[i].a)continue;if(outline[i])map[i]=h7;else{const n=clustered.assignments[i];map[i]=clustered.colors[n]||nearestBead(cells[i].lab);}}
      const passes=simplify==='strong'?2:simplify==='standard'?1:0;
      let result=smoothRegionColors(map,outline,w,h,passes,simplify);
      if(forceH7)result=completeLightContours(result,cells,outline,w,h,h7);
      return result;
    }

    function sampleImage(img,w,h){
      const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{willReadFrequently:true});
      ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.clearRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      const d=ctx.getImageData(0,0,w,h).data,out=[];
      for(let i=0;i<d.length;i+=4) out.push({r:d[i],g:d[i+1],b:d[i+2],a:d[i+3],lab:rgbToLab(d[i],d[i+1],d[i+2])});
      return out;
    }

    function limitColors(map,raw,limit){
      const counts=countColors(map);const allowedCodes=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(x=>x[0]);
      const allowed=palette.filter(p=>allowedCodes.includes(p.code));
      return map.map((p,i)=>p?nearestBead(raw[i].lab,allowed):null);
    }

    function countColors(map){const counts={};for(const p of map)if(p)counts[p.code]=(counts[p.code]||0)+1;return counts;}
    function textColor(p){return (p.r*.299+p.g*.587+p.b*.114)<145?'#fff':'#26221f';}

    function renderPattern(canvas,data,cell=22,minor=true){
      const ruler=Math.max(24,Math.round(cell*1.15)),{gridW:w,gridH:h,map}=data;
      canvas.width=w*cell+ruler*2;canvas.height=h*cell+ruler*2;const ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#fff9e8';ctx.fillRect(ruler,0,w*cell,ruler);ctx.fillRect(ruler,ruler+h*cell,w*cell,ruler);ctx.fillRect(0,ruler,ruler,h*cell);ctx.fillRect(ruler+w*cell,ruler,ruler,h*cell);
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=map[y*w+x];if(!p)continue;ctx.fillStyle=p.hex;ctx.fillRect(ruler+x*cell,ruler+y*cell,cell,cell);}
      const gx=ruler,gy=ruler,gw=w*cell,gh=h*cell;
      if(minor){ctx.save();ctx.strokeStyle='rgba(128,104,91,.23)';ctx.lineWidth=.7;ctx.setLineDash([2,2]);ctx.beginPath();for(let x=0;x<=w;x++){const px=gx+x*cell+.5;ctx.moveTo(px,gy);ctx.lineTo(px,gy+gh);}for(let y=0;y<=h;y++){const py=gy+y*cell+.5;ctx.moveTo(gx,py);ctx.lineTo(gx+gw,py);}ctx.stroke();ctx.restore();}
      ctx.save();ctx.setLineDash([]);for(let step=5;step<=Math.max(w,h);step+=5){const strong=step%10===0;ctx.strokeStyle=strong?'rgba(151,65,65,.62)':'rgba(168,92,80,.46)';ctx.lineWidth=strong?1.6:1;ctx.beginPath();if(step<w){const px=gx+step*cell+.5;ctx.moveTo(px,gy);ctx.lineTo(px,gy+gh);}if(step<h){const py=gy+step*cell+.5;ctx.moveTo(gx,py);ctx.lineTo(gx+gw,py);}ctx.stroke();}ctx.strokeStyle='#8e7a69';ctx.lineWidth=1.4;ctx.strokeRect(gx+.5,gy+.5,gw,gh);ctx.restore();
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`600 ${Math.max(7,Math.floor(cell*.33))}px Arial,sans-serif`;
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=map[y*w+x];if(!p)continue;ctx.fillStyle=textColor(p);ctx.fillText(p.code,gx+x*cell+cell/2,gy+y*cell+cell/2);}
      ctx.fillStyle='#4e453e';ctx.font=`${Math.max(7,Math.floor(cell*.34))}px Arial,sans-serif`;
      for(let x=0;x<w;x++){const t=String(x+1),cx=gx+x*cell+cell/2;ctx.fillText(t,cx,ruler/2);ctx.fillText(t,cx,ruler+gh+ruler/2);}
      for(let y=0;y<h;y++){const t=String(y+1),cy=gy+y*cell+cell/2;ctx.fillText(t,ruler/2,cy);ctx.fillText(t,ruler+gw+ruler/2,cy);}
    }

    function renderSummary(data){
      const items=getItems(data),modeName=data.mode==='crisp'?'清晰拼豆':'忠实原图';$('stats').innerHTML=`<div class="stat">模式 <b>${modeName}</b></div><div class="stat">尺寸 <b>${data.gridW}×${data.gridH}</b></div><div class="stat">颜色 <b>${items.length} 色</b></div><div class="stat">预计用量 <b>${data.total} 颗</b></div>`;
      $('paletteList').innerHTML=items.map(p=>`<div class="palette-item"><span class="swatch" style="background:${p.hex}"></span><span class="p-text"><span class="p-code">${p.code}</span><span class="p-name">${p.name}</span></span><span class="p-count">×${p.count}</span></div>`).join('');
    }
    function getItems(data){return Object.entries(data.counts).map(([code,count])=>({...palette.find(p=>p.code===code),count})).sort((a,b)=>b.count-a.count);}

    function roundedRect(ctx,x,y,w,h,r){const n=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+n,y);ctx.arcTo(x+w,y,x+w,y+h,n);ctx.arcTo(x+w,y+h,x,y+h,n);ctx.arcTo(x,y+h,x,y,n);ctx.arcTo(x,y,x+w,y,n);ctx.closePath();}
    function buildExportCanvas(){
      const pattern=document.createElement('canvas');renderPattern(pattern,currentData,28,$('minorGrid').checked);
      const items=getItems(currentData),margin=28,width=Math.max(pattern.width+margin*2,900),chipW=170,chipH=48,gap=10,cols=Math.max(1,Math.floor((width-margin*2+gap)/(chipW+gap))),rows=Math.ceil(items.length/cols);
      const summaryH=76,height=margin+pattern.height+summaryH+rows*(chipH+gap)+margin;
      const c=document.createElement('canvas');c.width=width;c.height=height;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);
      ctx.drawImage(pattern,Math.round((width-pattern.width)/2),margin);
      const summaryY=margin+pattern.height+36;ctx.fillStyle='#24211f';ctx.textAlign='left';ctx.textBaseline='middle';ctx.font='bold 25px "Microsoft YaHei",sans-serif';ctx.fillText(`${currentData.gridW}×${currentData.gridH} / ${items.length}色 / 共${currentData.total}颗`,margin,summaryY);
      const startY=margin+pattern.height+summaryH;
      items.forEach((p,i)=>{const col=i%cols,row=Math.floor(i/cols),x=margin+col*(chipW+gap),y=startY+row*(chipH+gap);ctx.fillStyle=p.hex;roundedRect(ctx,x,y,chipW,chipH,9);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.16)';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle=textColor(p);ctx.textBaseline='middle';ctx.font='bold 16px Arial,sans-serif';ctx.fillText(`${p.code}  (${p.count})`,x+12,y+17);ctx.font='12px "Microsoft YaHei",sans-serif';ctx.fillText(p.name,x+12,y+35);});
      return c;
    }

    function downloadPattern(){
      if(!currentData||!currentData.total)return;
      setStatus('正在制作高清图纸…');const c=buildExportCanvas();
      c.toBlob(blob=>{if(!blob){setStatus('下载生成失败，请重试。',true);return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`拼豆图纸_${currentData.gridW}x${currentData.gridH}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);setStatus('高清 PNG 图纸已生成。');},'image/png');
    }

    window.__BEAD_TEST__={paletteCount:palette.length,getData:()=>currentData,loadSample,buildExportCanvas,generate,performCutout,restoreOriginal,buildCrispMap,clusterCellColors,refineOutline,bridgeDirectionalGaps,completeLightContours};
    if(new URLSearchParams(location.search).get('sample')==='1') setTimeout(loadSample,80);
  })();
  </script>
